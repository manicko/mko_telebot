id: task_003_sec002

title: Delete orphaned test.session and add session path guard

priority: medium

depends_on:
  - TASK_002_STR001_remove_bom_post_processor

source_reference: .ai/audit/99-validation/04-security-validated-findings.md
source_section: SEC-002

description: >
  Delete the orphaned test.session file (perms 666, 28KB) from repo root
  and add a defensive guard preventing session files outside USER_DIR.

goals:
  - remove credential-at-rest hygiene risk
  - prevent future session file leakage outside USER_DIR

files:
  - path: test.session
    changes:
      - action: delete_file
        description: Delete orphaned Telethon session file from repo root

  - path: src/mko_telepost/core/telegram_poster.py
    targets:
      - type: class
        name: TelegramPoster
    semantic_anchors:
      insert_after:
        type: function_call
        value: set_restrictive_permissions
    changes:
      - action: add_code
        description: Add defensive check that session_path is within USER_DIR
        code_hint: |
          if not str(session_path.resolve()).startswith(str(APP_PATHS.user_settings_dir.resolve())):
              raise ValueError(f"Session path {session_path} is outside USER_DIR")

acceptance_criteria:
  - test.session deleted from working tree
  - session path guard added to TelegramPoster.create_client
  - uv run ruff check passes
  - uv run mypy passes
  - tests pass