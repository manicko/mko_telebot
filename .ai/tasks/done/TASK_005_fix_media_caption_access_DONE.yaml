id: TASK_005_fix_media_caption_access
title: Fix MessageMedia caption access logic bug
priority: medium

depends_on:
  - task_004

source_reference: .ai\plans\IMPLEMENTATION_PLANS.md
source_section: Error 5

description: >
  Remove non-functional caption extraction code in process_messages function.
  In Telethon's API, caption text is available in msg.message for media messages,
  not in msg.media.caption. The current code checks getattr(msg.media, "caption", None)
  which always returns None since the attribute doesn't exist, then would fail if
  accessing msg.media.caption directly.

goals:
  - Remove erroneous caption extraction logic
  - Preserve correct msg.message text extraction
  - Pass type checking

files:
  - path: src/mko_telebot/monitor_forward.py
    targets:
      - type: function
        name: process_messages
    semantic_anchors:
      insert_after:
        type: function_call
        value: msg.message

changes:
  - action: modify_code
    description: >
      Replace the media block in process_messages:
      FROM:
        if getattr(msg, "media", None):
            if getattr(msg.media, "caption", None):
                msg_content[group_id]["text"].append(msg.media.caption)
            msg_content[group_id]["media"].append(msg.media)
      TO:
        if getattr(msg, "media", None):
            msg_content[group_id]["media"].append(msg.media)

acceptance_criteria:
  - basedpyright passes on monitor_forward.py
  - ruff check passes on monitor_forward.py
  - caption text is still extracted via msg.message field

tests_to_run:
  - uv run ruff check src/mko_telebot/monitor_forward.py
  - uv run basedpyright src/mko_telebot/monitor_forward.py