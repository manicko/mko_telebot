id: task_031_str003

title: Split _try_send_message into _build_send_call and _handle_send_exception

priority: low

depends_on:
  - TASK_030_STR004_extract_telegram_sender

source_reference: .ai/audit/99-validation/09-structural-quality-validated-findings.md
source_section: STR-003

description: >
  Split the extracted _try_send_message in telegram_sender.py into two
  focused helpers: _build_send_call (constructs the send parameters) and
  _handle_send_exception (maps Telethon exception types to retry/abort).

goals:
  - reduce nesting depth of the send function
  - separate construction from error handling
  - improve maintainability of the 4-except-branch error handler

files:
  - path: src/mko_telepost/core/telegram_sender.py
    targets:
      - type: function
        name: _try_send_message
    changes:
      - action: edit_code
        description: Extract _build_send_call and _handle_send_exception helper methods
        code_hint: |
          def _build_send_call(self, task: Task) -> dict: ...
          def _handle_send_exception(self, e: Exception, task: Task) -> bool: ...
          def _try_send_message(self, task: Task) -> bool:
              kwargs = self._build_send_call(task)
              try:
                  ...
              except Exception as e:
                  return self._handle_send_exception(e, task)

acceptance_criteria:
  - _try_send_message delegates to _build_send_call and _handle_send_exception
  - all 4 except branches correctly routed
  - all existing tests pass
  - uv run mypy passes