id: task_020_sec_preserve_telethon_config

source_reference: .ai\audit\99-validation\04-security-validated-findings.md
source_section: SEC-001

title: Preserve existing telethon_config.yaml on init --force

priority: medium

description: >
  SEC-001: `init --force` overwrites user's Telegram credentials in telethon_config.yaml.
  Should skip telethon_config.yaml when user file exists to preserve credentials.

goals:
  - Skip telethon_config.yaml copy when user file already exists
  - Log info message about preservation
  - Prevent accidental credential loss

files:
  - path: src/mko_telebot/cli.py
    targets:
      - type: function
        name: init
    semantic_anchors:
      - action: add_conditional_skip
        target: init
        around_file_copy_loop

changes:
  - action: preserve_credentials
    description: >
      In the init command loop, check if telethon_config.yaml already exists in
      user config directory. If so, skip copying and log "Preserved existing
      telethon_config.yaml". Only copy when file doesn't exist.

acceptance_criteria:
  - Existing telethon_config.yaml is preserved on --force
  - New installation still copies template
  - Clear log message on preservation
  - All tests pass

tests_to_run:
  - uv run pytest tests/test_cli.py -v -k "init"