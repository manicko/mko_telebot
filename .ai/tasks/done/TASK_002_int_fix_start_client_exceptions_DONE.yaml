id: task_002_int_fix_start_client_exceptions

source_reference: .ai\audit\99-validation\05-integrations-validated-findings.md
source_section: INT-001

title: Fix start_client to catch Telethon exception types

priority: high

description: >
  INT-001: `start_client()` catches the wrong exception types; real Telethon failures
  crash the process. The current code catches `TelegramAuthError` and `TelegramServiceError`
  but Telethon raises its own exception hierarchy (`RPCError` subclasses, `ValueError`, 
  `OSError`, `ConnectionError`, `asyncio.TimeoutError`).

goals:
  - Catch Telethon's actual exception types
  - Map exceptions to `TelegramAuthError` or `TelegramServiceError`
  - Return `False` on auth failure for graceful handling

files:
  - path: src/mko_telebot/monitor_client.py
    targets:
      - type: function
        name: start_client
    semantic_anchors:
      - action: replace_exception_types
        target: start_client
        line_range: 75-92
        old: except (TelegramAuthError, TelegramServiceError)
        new: except (telethon.errors.RPCError, ValueError, OSError, ConnectionError, asyncio.TimeoutError)

changes:
  - action: modify_exception_handling
    description: >
      Catch Telethon exception hierarchy directly. Map auth-related errors 
      (AuthKeyUnregisteredError, SessionPasswordNeededError, ValueError for 2FA) 
      to TelegramAuthError. Map connectivity/RPC errors to TelegramServiceError.

acceptance_criteria:
  - All Telethon exceptions are caught and mapped
  - Function returns False on auth failure
  - No raw tracebacks leak on auth/connect failures
  - All existing tests continue to pass

tests_to_run:
  - uv run pytest tests/test_monitor.py -v -k "start_client"
  - uv run pytest tests/test_monitor_client.py -v