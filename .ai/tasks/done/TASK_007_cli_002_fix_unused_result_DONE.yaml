# CLI unused result fix - CLI-002

id: TASK_007_cli_002_fix_unused_result
title: Assign shutil.copy2 result to underscore to indicate intentional discard
priority: low

depends_on: []

source_reference: .ai/audit/99-validation/01-cli-validated.md
source_section: CLI-002
source_blocks:
  - "CLI-002: Unused result from shutil.copy2 in init command"

description: >
  The shutil.copy2 call in the init command returns a path that is not captured.
  Assign to underscore to indicate intentional discard and satisfy the
  basedpyright linter's reportUnusedCallResult warning.

goals:
  - Fix basedpyright reportUnusedCallResult warning
  - Indicate intentional discard with underscore assignment

files:
  - path: src/mko_telebot/cli.py
    targets:
      - type: function
        name: init

changes:
  - action: replace_in_body
    description: Assign shutil.copy2 result to underscore
    old_snippet: 'shutil.copy2(item, target)'
    new_snippet: '_ = shutil.copy2(item, target)'
    target: init

acceptance_criteria:
  - basedpyright reportUnusedCallResult warning resolved
  - File copy behavior unchanged
  - Tests pass

risk: low
risk_justification: >
  Simple code style fix with no behavioral impact. The underscore convention
  clearly indicates the return value is intentionally discarded.