id: task_030_str004

title: Extract TelegramSender module from TelegramService

priority: low

depends_on:
  - TASK_029_SRV002_remove_dead_get_cache_path

source_reference: .ai/audit/99-validation/09-structural-quality-validated-findings.md
source_section: STR-004

description: >
  Extract _try_send_message and related send logic from telegram_service.py
  into a new telegram_sender.py module. The sender takes client +
  max_retries but not delay_engine or _chat_configs — those stay in the
  orchestrator.

goals:
  - reduce telegram_service.py size (currently 327 non-blank lines — largest file)
  - clean separation: orchestrator vs sender
  - _try_send_message stays in orchestrator-level telegram_service.py; extracted module handles Telegram API calls

files:
  - path: src/mko_telepost/core/telegram_sender.py
    changes:
      - action: add_file
        description: Create new module with extracted send logic
        code_hint: |
          Move _try_send_message, retry/error handling into TelegramSender class.
          Takes TelegramClient + max_retries. Returns success/failure.
          Does not touch self.delay_engine, self._chat_configs, or self settings.

  - path: src/mko_telepost/core/telegram_service.py
    targets:
      - type: function
        name: _try_send_message
    changes:
      - action: delete_code
        description: Remove _try_send_message from telegram_service.py after extraction
      - action: add_code
        description: Add self.sender = TelegramSender(...) and delegate calls

acceptance_criteria:
  - telegram_sender.py created with extracted send logic
  - telegram_service.py reduced in size
  - all existing tests pass
  - uv run mypy passes