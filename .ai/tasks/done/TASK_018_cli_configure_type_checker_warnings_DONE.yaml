id: task_018_cli_configure_type_checker_warnings

source_reference: .ai\audit\99-validation\01-cli-validated-findings.md
source_section: CLI-006

title: Configure basedpyright to suppress Telethon type-stub warnings

priority: low

description: >
  CLI-006: Type-checker warnings on the CLI layer. Telethon package lacks type stubs,
  causing reportMissingTypeStubs warnings. Should configure basedpyright to suppress
  these for external dependencies while keeping other warnings enabled.

goals:
  - Add [tool.basedpyright] section to pyproject.toml
  - Set reportMissingTypeStubs = "none" for telethon
  - Keep reportExplicitAny and other warnings enabled

files:
  - path: pyproject.toml
    targets:
      - type: tool_config
        name: basedpyright
    semantic_anchors:
      - action: add_tool_section
        target: pyproject.toml
        section: basedpyright

changes:
  - action: configure_type_checker
    description: >
      Add `[tool.basedpyright]` with `reportMissingTypeStubs = "none"` to acknowledge
      Telethon as external dependency without type stubs. Keep other warnings for
      code we control.

acceptance_criteria:
  - Reduced basedpyright warning count
  - No reportMissingTypeStubs warnings for telethon
  - Other type warnings still enabled

tests_to_run:
  - uv run basedpyright src/mko_telebot/ check