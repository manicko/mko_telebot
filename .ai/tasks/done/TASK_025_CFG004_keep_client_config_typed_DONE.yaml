id: task_025_cfg004

title: Keep ClientConfig typed on TelegramPoster instead of raw dict

priority: low

depends_on:
  - TASK_024_verify_INT001_telegram_run_rewrite

source_reference: .ai/audit/99-validation/02-config-validated-findings.md
source_section: CFG-004
also: .ai/audit/99-validation/08-quality-validated-findings.md QLT-006

description: >
  Keep the TelethonConfig/ClientConfig model as the typed source of truth
  on TelegramPoster instead of storing a raw dict via model_dump(). Build
  the kwargs dict locally inside create_client() at the Telethon boundary.

goals:
  - eliminate persistent raw dict as instance state
  - remove manual SecretStr unwrapping
  - keep model as authoritative typed representation

files:
  - path: src/mko_telepost/core/telegram_poster.py
    targets:
      - type: class
        name: TelegramPoster
      - type: function
        name: __init__
    changes:
      - action: edit_code
        description: Remove self.client_config = settings.client.model_dump() and manual api_hash extraction
        code_hint: |
          # Remove:
          self.client_config = settings.client.model_dump()
          if "api_hash" in self.client_config:
              self.client_config["api_hash"] = settings.client.api_hash.get_secret_value()
          # Keep reference:
          self.client_config_model = settings.client

  - path: src/mko_telepost/core/telegram_poster.py
    targets:
      - type: class
        name: TelegramPoster
      - type: function
        name: create_client
    changes:
      - action: edit_code
        description: Build kwargs dict locally from typed model fields
        code_hint: |
          config = {
              "session": str(session_path),
              "api_id": self.client_config_model.api_id,
              "api_hash": self.client_config_model.api_hash.get_secret_value(),
              ...
          }
          return TelegramClient(**config)

acceptance_criteria:
  - no self.client_config dict on TelegramPoster instance
  - create_client builds kwargs from typed model fields
  - no manual get_secret_value() outside create_client
  - uv run mypy passes
  - uv run pytest tests/ passes