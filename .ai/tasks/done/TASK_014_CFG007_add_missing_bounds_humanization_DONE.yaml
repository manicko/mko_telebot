id: task_014_cfg007

title: Add missing ge/le bounds to HumanizationConfig fields

priority: low

depends_on:
  - TASK_013_CFG003_add_base_max_delay_validator

source_reference: .ai/audit/99-validation/02-config-validated-findings.md
source_section: CFG-007

description: >
  Add the missing ge/le bounds to min_delay_seconds, max_delay_seconds,
  and micro_break_seconds in HumanizationConfig for symmetric field constraints.

goals:
  - symmetric ge/le bounds on all delay fields
  - catch typo'd values at config time

files:
  - path: src/mko_telepost/core/chat_models.py
    targets:
      - type: class
        name: HumanizationConfig
    changes:
      - action: edit_field
        description: Add le=3600 to min_delay_seconds
        code_hint: min_delay_seconds: float = Field(default=5.0, ge=0.5, le=3600)
      - action: edit_field
        description: Add ge=0.5 to max_delay_seconds
        code_hint: max_delay_seconds: float = Field(default=600.0, ge=0.5, le=3600)
      - action: edit_field
        description: Add le=3600 to micro_break_seconds
        code_hint: micro_break_seconds: float = Field(default=120.0, ge=30.0, le=3600)

acceptance_criteria:
  - min_delay_seconds now has le=3600
  - max_delay_seconds now has ge=0.5
  - micro_break_seconds now has le=3600
  - existing valid defaults remain unchanged
  - uv run pytest tests/test_models.py passes