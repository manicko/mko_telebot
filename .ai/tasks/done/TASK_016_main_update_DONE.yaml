id: TASK_016_main_update
title: "Wave 4 — Update main.py to delegate to CLI"
priority: low
depends_on:
  - TASK_015_cli_entry
source_reference: .ai/plans/01/PLAN_01_WAVE_04.md
source_section: "Task 4.4 — Update main.py"

description: >
  Update `src/mko_telebot/main.py` to delegate to the CLI entry point.
  Preserves backward compatibility for `python -m mko_telebot.main`.

goals:
  - delegate to cli.main()
  - preserve backward compatibility
  - clean module docstring

files:
  - path: src/mko_telebot/main.py
    targets:
      - type: module
        name: mko_telebot.main
    changes:
      - action: rewrite
        description: Rewrite main.py to delegate to cli.main()

acceptance_criteria:
  - python -m mko_telebot.main works
  - ruff check passes with no errors
  - main.py delegates to cli.main()

tests_to_run:
  - uv run ruff check src/mko_telebot/main.py
  - uv run python -c "from mko_telebot.main import main; print('OK')"