id: TASK_007_chats_config
title: "Wave 2 — Create channels config models"
priority: high
depends_on:
  - TASK_002_create_errors
source_reference: .ai/plans/01/PLAN_01_WAVE_02.md
source_section: "Task 2.3 — Create channels config models"

description: >
  Create `src/mko_telebot/core/chats_config.py` with LogLevel (StrEnum), ChannelConfig,
  ChannelDefaults, and ChatsConfig Pydantic models. ChatsConfig has model_validator
  to strip "DEFAULTS" from channels dict.

goals:
  - create LogLevel StrEnum with DEBUG/INFO/WARNING/ERROR/CRITICAL
  - create ChannelConfig with all monitoring fields
  - create ChannelDefaults (same fields minus name)
  - create ChatsConfig with defaults + channels + model_validator
  - all models use ConfigDict(extra="forbid")

files:
  - path: src/mko_telebot/core/chats_config.py
    targets:
      - type: class
        name: LogLevel
      - type: class
        name: ChannelConfig
      - type: class
        name: ChannelDefaults
      - type: class
        name: ChatsConfig
    changes:
      - action: create
        description: Create chats_config.py with all channel configuration models

acceptance_criteria:
  - LogLevel StrEnum has DEBUG, INFO, WARNING, ERROR, CRITICAL values
  - ChannelConfig has all 7 fields (name, forward_to, keywords, scan_interval, history_limit, history_days, overlap)
  - ChannelDefaults has same fields minus name
  - ChatsConfig has defaults (ChannelDefaults), channels (dict[str, ChannelConfig]), channels_delay, stagger_start_seconds
  - ChatsConfig.model_validator strips "DEFAULTS" from channels dict
  - ConfigDict(extra="forbid") on all models
  - ruff check passes with no errors
  - mypy passes with no errors

tests_to_run:
  - uv run ruff check src/mko_telebot/core/chats_config.py
  - uv run mypy src/mko_telebot/core/chats_config.py