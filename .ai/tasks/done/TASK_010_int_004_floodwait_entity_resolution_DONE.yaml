# FloodWaitError handling in entity resolution - INT-004

id: TASK_010_int_004_floodwait_entity_resolution
title: Handle FloodWaitError during entity resolution with wait before re-raising
priority: medium

depends_on:
  - TASK_009

source_reference: .ai/audit/99-validation/05-integrations-validated.md
source_section: INT-004
source_blocks:
  - "INT-004: Unresolved FloodWaitError during entity resolution causes unhandled exception"
  - "Recommendation Clarification for INT-004"

description: >
  The resolve_channel_entity() and resolve_targets_entities() methods in
  task.py catch all exceptions and re-raise as TelegramServiceError without
  any wait logic for FloodWaitError. When FloodWaitError occurs during
  get_entity() calls for channel or target resolution, the application
  stops rather than waiting and potentially recovering. Add special handling
  for FloodWaitError to wait for the specified duration before re-raising.

goals:
  - Add FloodWaitError handling in resolve_channel_entity()
  - Add FloodWaitError handling in resolve_targets_entities()
  - Wait for specified duration plus jitter before re-raising
  - Give monitor chance to recover from rate-limit windows

files:
  - path: src/mko_telebot/core/task.py
    targets:
      - type: method
        name: resolve_channel_entity
      - type: method
        name: resolve_targets_entities

changes:
  - action: add_code
    description: Add FloodWaitError import and special handling in resolve_channel_entity
    code_hint: |
      import asyncio
      import random
      from telethon.errors import FloodWaitError
      
      # In resolve_channel_entity exception handling:
      except FloodWaitError as e:
          logger.warning(
              f"Flood wait {e.seconds}s while resolving channel {self.channel_name}"
          )
          await asyncio.sleep(e.seconds + random.uniform(5, 10))
          raise TelegramServiceError(
              f"Failed to resolve entity for channel {self.channel_name} after flood wait"
          ) from e
    target: resolve_channel_entity
  - action: add_code
    description: Add same FloodWaitError handling in resolve_targets_entities
    code_hint: |
      # Similar FloodWaitError handling pattern for targets resolution
      except FloodWaitError as e:
          logger.warning(
              f"Flood wait {e.seconds}s while resolving targets for channel {self.channel_name}"
          )
          await asyncio.sleep(e.seconds + random.uniform(5, 10))
          raise TelegramServiceError(
              f"Failed to resolve target entities for channel {self.channel_name} after flood wait"
          ) from e
    target: resolve_targets_entities

acceptance_criteria:
  - FloodWaitError during entity resolution triggers wait behavior
  - Wait time includes jitter (random.uniform(5, 10))
  - TelegramServiceError still raised after wait to signal failure
  - Tests verify wait behavior

risk: medium
risk_justification: >
  Changes error handling timing in async entity resolution. The wait logic
  adds async sleep which could delay startup, but follows established pattern
  from monitor_forward.py for FloodWaitError handling.