id: TASK_004_fix_entity_type_mismatch
title: Fix entity type mismatch in forward operations
priority: medium

depends_on:
  - task_002

source_reference: .ai\plans\IMPLEMENTATION_PLANS.md
source_section: Error 4

description: >
  Fix Entity type mismatch in Task and _send_with_retry. Task.forward_to_entities
  is typed as list[object] but should be list[Entity]. Task.channel_entity is typed
  as None | Any but should be Entity | None. _send_with_retry target parameter
  should use Entity type instead of Any.

goals:
  - Add proper Entity type imports
  - Update Task class attribute types
  - Update method signatures with proper types
  - Pass type checking

files:
  - path: src/mko_telebot/core/task.py
    targets:
      - type: import_statement
        value: from typing import Any
      - type: class
        name: Task
      - type: method
        name: resolve_targets_entities
      - type: method
        name: resolve_channel_entity

  - path: src/mko_telebot/monitor_forward.py
    targets:
      - type: function
        name: _send_with_retry

changes:
  - action: add_import
    description: >
      Add `from telethon.hints import Entity` to task.py

  - action: modify_code
    description: >
      Update Task.__init__ attribute type annotations:
      self.channel_entity: Entity | None = None
      self.forward_to_entities: list[Entity] = []

  - action: modify_signature
    description: >
      Update resolve_targets_entities to accept TelegramClient and entities: list[Entity] = []

  - action: modify_signature
    description: >
      Update resolve_channel_entity to accept TelegramClient

  - action: modify_signature
    description: >
      Update _send_with_retry target parameter type to Entity

acceptance_criteria:
  - basedpyright passes on core/task.py and monitor_forward.py
  - ruff check passes on both files
  - entity resolution works correctly

tests_to_run:
  - uv run ruff check src/mko_telebot/core/task.py src/mko_telebot/monitor_forward.py
  - uv run basedpyright src/mko_telebot/core/task.py src/mko_telebot/monitor_forward.py