# Refactor message grouping - STR-002

id: TASK_014_str_002_extract_message_grouping
title: Extract message grouping logic from process_messages to reduce complexity
priority: medium

depends_on:
  - TASK_013_srv_001_media_captions_matching

source_reference: .ai/audit/99-validation/09-structural-quality-validated.md
source_section: STR-002
source_blocks:
  - "STR-002: High Cyclomatic Complexity in process_messages"

description: >
  The process_messages function combines multiple responsibilities: message
  grouping, content extraction, keyword matching, and forwarding orchestration.
  Extract the message grouping logic into a dedicated helper function
  (_group_messages_by_album) to reduce complexity and improve testability.

goals:
  - Extract message grouping to separate function
  - Reduce cyclomatic complexity in process_messages
  - Improve code modularity and testability
  - Preserve existing behavior

files:
  - path: src/mko_telebot/monitor_forward.py
    targets:
      - type: function
        name: process_messages

changes:
  - action: add_top_level
    description: Create _group_messages_by_album helper function before process_messages
    code_hint: |
      def _group_messages_by_album(
          messages: Sequence[Message],
      ) -> dict[int | None, list[Message]]:
          """Group messages by their album_id for combined processing."""
          msg_content: dict[int | None, list[Message]] = {}
          for msg in messages:
              album_id = msg.grouped_id if msg.grouped_id else id(msg)
              if album_id not in msg_content:
                  msg_content[album_id] = []
              msg_content[album_id].append(msg)
          return msg_content
    target: process_messages
  - action: replace_in_body
    description: Replace inline grouping logic with call to helper function
    old_snippet: |
      msg_content: dict[int | None, list[Message]] = {}
      for msg in messages:
          album_id = msg.grouped_id if msg.grouped_id else id(msg)
          if album_id not in msg_content:
              msg_content[album_id] = []
          msg_content[album_id].append(msg)
    new_snippet: |
      msg_content = _group_messages_by_album(messages)
    target: process_messages

acceptance_criteria:
  - _group_messages_by_album helper function created
  - process_messages uses helper instead of inline grouping
  - Message grouping behavior preserved
  - Tests pass identically to before

risk: medium
risk_justification: >
  Refactoring that changes code structure but not behavior. The helper
  function must be functionally equivalent to the inline logic. Changes
  touch core message processing path.