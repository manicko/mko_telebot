id: TASK_010_research_telethon_stubs
title: Research Telethon stubs approach
priority: medium

depends_on: []

status: done

source_reference: .ai\plans\IMPLEMENTATION_PLANS.md
source_section: Error 9

description: >
  Research task for the `await client.start()` false positive.
  Telethon has no type stubs, causing basedpyright to infer start() returns TelegramClient
  instead of a coroutine. This task produced a go recommendation.

goals:
  - Research all options for fixing the false positive
  - Identify all dependents of TelegramClient.start() calls
  - Evaluate stubs vs # type: ignore approach
  - Produce go/no-go recommendation

research_steps:
  - identify: Find all usages of client.start() and client.disconnect() in codebase
  - analyze: Check if telethon-stubs package exists and its compatibility
  - evaluate: Assess maintainability of stub files vs inline ignore comments
  - decide: Recommend one approach with justification

pass_criteria:
  - Complete analysis document with recommendation
  - Recommendation must be "go" or "go-with-changes" or "no-go"

failure_action: return to planner for alternative approach

implementation_notes:
  - telethon-stubs package does NOT exist on PyPI
  - TelegramClient.start() dynamically returns coroutine in async context
  - Decided on `# pyright: ignore[reportGeneralTypeIssues]` inline comments
  - Applied fixes to monitor_client.py lines 77, 81 (start calls) and line 54 (proxy arg)
  - Updated proxy_dict type annotation to match ProxyConfig.to_dict return type

validation_results:
  - ruff check: passed
  - mypy: passed
  - basedpyright: 0 errors (down from 4)
  - pytest: all 302 tests passed