id: task_026_qlt004

title: Consume _coordinate_posting return value and log run summary

priority: medium

depends_on:
  - TASK_025_CFG004_keep_client_config_typed

source_reference: .ai/audit/99-validation/08-quality-validated-findings.md
source_section: QLT-004

description: >
  Initialize _last_success_count / _last_failed_count in __init__ to make
  state explicit. Consume the tuple returned by _coordinate_posting in run()
  and log a run-level summary. Remove the fragile getattr fallback.

goals:
  - explicit counter initialization
  - capture and log run summary
  - eliminate getattr fallback

files:
  - path: src/mko_telepost/core/telegram_service.py
    targets:
      - type: function
        name: __init__
    changes:
      - action: add_code
        description: Initialize _last_success_count and _last_failed_count to 0
        code_hint: |
          self._last_success_count = 0
          self._last_failed_count = 0

  - path: src/mko_telepost/core/telegram_service.py
    targets:
      - type: function
        name: run
    changes:
      - action: edit_code
        description: Capture return value from _coordinate_posting and log summary
        code_hint: |
          success_count, failed_count = await self._coordinate_posting(...)
          logger.info("Posting complete: %s succeeded, %s failed", success_count, failed_count)

  - path: src/mko_telepost/core/telegram_service.py
    targets:
      - type: function
        name: _coordinate_posting
    changes:
      - action: edit_code
        description: Replace getattr fallback with direct attribute access
        code_hint: return self._last_success_count, self._last_failed_count

acceptance_criteria:
  - counters initialized in __init__
  - return value consumed in run() and logged as summary
  - no getattr fallback in _coordinate_posting
  - uv run mypy passes
  - uv run pytest tests/ passes