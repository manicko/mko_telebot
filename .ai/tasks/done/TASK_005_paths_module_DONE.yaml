id: TASK_005_paths_module
title: "Wave 2 — Create path management module"
priority: high
depends_on:
  - TASK_002_create_errors
source_reference: .ai/plans/01/PLAN_01_WAVE_02.md
source_section: "Task 2.1 — Create path management module"

description: >
  Create `src/mko_telebot/core/paths.py` with AppPaths (BaseModel), APP_PATHS singleton,
  and PathResolver utility class. Pure path computation only — no I/O at module level.

goals:
  - create AppPaths model with all directory/file properties
  - create APP_PATHS module-level singleton
  - create PathResolver utility class
  - no module-level I/O or side effects

files:
  - path: src/mko_telebot/core/paths.py
    targets:
      - type: class
        name: AppPaths
      - type: class
        name: PathResolver
      - type: variable
        name: APP_PATHS
    semantic_anchors:
      - type: class
        name: AppPaths
      - type: class
        name: PathResolver
    changes:
      - action: create
        description: Create paths.py with AppPaths, PathResolver, APP_PATHS

acceptance_criteria:
  - AppPaths model exists with all properties (app_settings_dir, user_settings_dir, state_dir, session_dir, log_dir, config_file, secrets_file, log_config_file)
  - APP_PATHS singleton exists and is fully initialized
  - PathResolver exists with resolve(), ensure_dir(), ensure_file_parent() methods
  - ConfigDict(extra="forbid") on AppPaths
  - ruff check passes with no errors
  - mypy passes with no errors
  - no module-level I/O in the file

tests_to_run:
  - uv run ruff check src/mko_telebot/core/paths.py
  - uv run mypy src/mko_telebot/core/paths.py