id: task_017_sec001

title: Break ValidationError cause chain to stop credential leak

priority: critical

status: blocked

blocked_by:
  - TASK_016_research_SEC001_credential_leak

depends_on:
  - TASK_016_research_SEC001_credential_leak

source_reference: .ai/audit/99-validation/04-security-validated-findings.md
source_section: SEC-001

description: >
  Raise ConfigError(sanitized_msg) from None in _validate_settings instead
  of from e, breaking the ValidationError cause chain that exposes
  api_hash/phone_or_token input_value in logger.exception output.
  Extend the sanitization test to capture log output (both stderr and
  file handler) and assert secret is absent from formatted traceback.

goals:
  - stop api_hash/phone_or_token from appearing in log output
  - extend regression test to cover logger.exception path

files:
  - path: src/mko_telepost/core/config_reader.py
    targets:
      - type: class
        name: TelepostConfigReader
      - type: function
        name: _validate_settings
    changes:
      - action: edit_code
        description: Change raise ConfigError(sanitized_msg) from e to raise ConfigError(sanitized_msg) from None
        code_hint: raise ConfigError(sanitized_msg) from None

  - path: src/mko_telepost/core/config_reader.py
    targets:
      - type: class
        name: TelepostConfigReader
      - type: function
        name: load
    changes:
      - action: edit_code
        description: Audit the generic except Exception raise ... from e at load() line 112 — remove cause chain
        code_hint: raise ConfigError(...) from None (if it chains ValidationError)

  - path: tests/test_validation_sanitization.py
    targets:
      - type: function
        name: test_sanitized_error_no_input_value
    changes:
      - action: edit_code
        description: Extend to capture logging output and assert secret absent from formatted traceback
        code_hint: |
          Use caplog or log capture handler to assert the secret does not appear
          in logger.exception output. Cover both stderr and file handler paths.

acceptance_criteria:
  - api_hash/phone_or_token do not appear in log output on config validation failure
  - both raise ... from sites in config_reader.py fixed
  - regression test captures logging output and asserts secret absent from traceback
  - uv run pytest tests/test_validation_sanitization.py passes