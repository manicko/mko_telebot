id: task_008_cfg005

title: Add api_id sentinel validator to ClientConfig

priority: low

depends_on:
  - TASK_007_CLI003_config_table_overflow

source_reference: .ai/audit/99-validation/02-config-validated-findings.md
source_section: CFG-005

description: >
  Add a @field_validator("api_id") to ClientConfig that rejects the
  template sentinel value 12345, so an unedited template fails at config
  time instead of at Telegram runtime.

goals:
  - catch template placeholder at config-load time
  - extend existing placeholder-guard pattern to integer fields

files:
  - path: src/mko_telepost/core/telethon_models.py
    targets:
      - type: class
        name: ClientConfig
    semantic_anchors:
      insert_after:
        type: function
        name: validate_api_hash
    changes:
      - action: add_code
        description: Add field_validator for api_id rejecting 12345
        code_hint: |
          @field_validator("api_id")
          @classmethod
          def validate_api_id(cls, v: int) -> int:
              if v == 12345:
                  raise ValueError("api_id value 12345 is a template placeholder. "
                      "Replace with your actual API ID from https://my.telegram.org/apps.")
              return v

  - path: src/mko_telepost/settings/app_config.yaml
    changes:
      - action: edit_text
        description: Update inline comment to document 12345 is a sentinel
        code_hint: s/12345.*$/12345  # Replace with your API ID (must be > 0; 12345 is a sentinel and will be rejected)/

acceptance_criteria:
  - config with api_id=12345 rejected at load time with clear error
  - valid api_id values pass through unchanged
  - tests in test_models.py updated/added for the new validator
  - uv run pytest tests/test_models.py passes