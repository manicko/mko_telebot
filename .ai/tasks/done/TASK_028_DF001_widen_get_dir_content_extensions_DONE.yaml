id: task_028_df001

title: Widen get_dir_content extensions and fix silent post loss for non-JPEG directories

priority: medium

depends_on:
  - TASK_027_SEC004_photo_path_containment_before_fs_access

source_reference: .ai/audit/99-validation/06-data-flow-validated-findings.md
source_section: DF-001

description: >
  Widen get_dir_content default extensions to match PIL-supported formats
  (jpg, jpeg, png, webp, gif, bmp, tiff, tif). Replace the silent-data-loss
  fallback (returning directory path) with a WARNING log and return [].
  Update SPEC and troubleshooting docs.

goals:
  - non-JPEG directory entries no longer cause silent post loss
  - user receives clear warning instead of silent failure
  - docs match implementation

files:
  - path: src/mko_telepost/core/utils.py
    targets:
      - type: function
        name: get_dir_content
    changes:
      - action: edit_field
        description: Widen default extensions to PIL-supported formats
        code_hint: extensions: tuple[str, ...] = ("jpg", "jpeg", "png", "webp", "gif", "bmp", "tiff", "tif")

  - path: src/mko_telepost/core/post_processor.py
    targets:
      - type: function
        name: _extract_photo_paths
    changes:
      - action: edit_code
        description: Replace silent fallback with WARNING log and return []
        code_hint: |
          raw = get_dir_content(raw_entry_resolved)
          if raw:
              return [Path(p) for p in raw]
          logger.warning("No supported image files found in directory: %s", raw_entry_resolved)
          return []

  - path: docs/SPEC.md
    changes:
      - action: edit_text
        description: Update directory resolution bullet in section 5.3 to list supported extensions

  - path: docs/11-guides/troubleshooting.md
    changes:
      - action: edit_text
        description: Remove jpg/jpeg-only restriction sentence at line 146, reconcile with line 138
        code_hint: Remove "For directories: ensure they contain .jpg or .jpeg files"

acceptance_criteria:
  - get_dir_content default extensions expanded to PIL-supported formats
  - non-supported-image directory returns [] with WARNING log (not directory path)
  - SPEC.md updated
  - troubleshooting.md line 146/138 reconciled
  - uv run ruff check passes
  - uv run mypy passes
  - tests pass