id: TASK_003_parser_no_sidefx
title: "Wave 1 — Remove import-time side effects from parser.py"
priority: high
depends_on: []
source_reference: .ai/plans/01/PLAN_01_WAVE_01.md
source_section: "Task 1.3 — Remove import-time side effects from parser.py"

description: >
  Remove the import-time side effect in `src/mko_telebot/core/parser.py` where
  `logging.config.dictConfig(CONFIG.LOGGING.model_dump())` is called at module level.
  Remove `import logging.config` and `from mko_telebot.core import CONFIG`.
  Keep `import logging` and `logger = logging.getLogger(__name__)`.

goals:
  - remove module-level logging.config.dictConfig() call
  - remove import logging.config
  - remove from mko_telebot.core import CONFIG
  - keep import logging and logger = logging.getLogger(__name__)
  - all existing parser tests still pass

files:
  - path: src/mko_telebot/core/parser.py
    targets:
      - type: import
        name: import logging.config
      - type: import
        name: from mko_telebot.core import CONFIG
    semantic_anchors:
      - type: code_block
        name: module-level dictConfig call
    changes:
      - action: remove
        description: Remove import logging.config
      - action: remove
        description: Remove from mko_telebot.core import CONFIG
      - action: remove
        description: Remove module-level logging.config.dictConfig() call
      - action: keep
        description: Keep import logging and logger = logging.getLogger(__name__)
      - action: keep
        description: Keep import typing, pathlib, re, datetime

acceptance_criteria:
  - import logging.config removed from parser.py
  - from mko_telebot.core import CONFIG removed from parser.py
  - logger = logging.getLogger(__name__) remains
  - ruff check passes with no errors
  - mypy passes with no errors
  - all existing parser tests pass

tests_to_run:
  - uv run ruff check src/mko_telebot/core/parser.py
  - uv run mypy src/mko_telebot/core/parser.py
  - uv run pytest tests/test_parser.py -v