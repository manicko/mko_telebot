id: task_024_tst_add_extra_forbid_tests

source_reference: .ai\audit\99-validation\07-tests-validated-findings.md
source_section: TST-002

title: Add tests for extra="forbid" schema-strictness guardrail

priority: medium

description: >
  TST-002: Every config model sets `extra="forbid"` to reject unknown YAML keys,
  but no test asserts this guardrail. Need tests to prevent silent misconfiguration.

goals:
  - Add test for each Pydantic model with unexpected key
  - Verify ValidationError is raised for unknown fields
  - Cover TelepostSettings, ChannelConfig, ChannelDefaults, ChannelsConfig,
    ProxyConfig, ClientConfig, TelethonConfig

files:
  - path: tests/test_config_reader.py
    targets:
      - type: test_module
    semantic_anchors:
      - action: add_extra_forbid_tests
        target: test_config_reader.py
        location: near TestValidators class

changes:
  - action: add_tests
    description: >
      For each model (TelepostSettings, ChannelConfig, ChannelDefaults, ChannelsConfig,
      ProxyConfig, ClientConfig, TelethonConfig), add test asserting construction with
      an unexpected key raises ValidationError.

acceptance_criteria:
  - All models have extra="forbid" tests
  - Typo'd YAML keys are rejected
  - All existing tests pass

tests_to_run:
  - uv run pytest tests/test_config_reader.py -v