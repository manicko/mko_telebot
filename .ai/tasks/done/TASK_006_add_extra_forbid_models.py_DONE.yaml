description: |
  TelepostSettings root model lacks extra="forbid" in model_config, unlike all sub-models.
  This means typos in top-level config YAML keys would be silently ignored instead of 
  raising validation errors. Should add extra="forbid" alongside the existing 
  populate_by_name=True.

goals:
  - Add extra="forbid" to TelepostSettings model_config
  - Match pattern used by all sub-models (TelethonConfig, ChannelsConfig, etc.)
  - Catch config key typos at validation time

files:
  - path: src/mko_telebot/core/models.py

    targets:
      - type: class
        name: TelepostSettings

    semantic_anchors:
      insert_after:
        type: class_variable
        value: model_config

changes:
  - action: replace_in_body
    description: |
      Change model_config from:
        model_config = ConfigDict(populate_by_name=True)
      To:
        model_config = ConfigDict(populate_by_name=True, extra="forbid")

acceptance_criteria:
  - TelepostSettings.model_config has extra="forbid"
  - No mypy or ruff errors
  - All existing tests still pass