id: task_035_cfg001

title: Resolve relative --config path against CWD before constructing reader

priority: high

depends_on:
  - TASK_034_STR006_refactor_load_and_validate_config

source_reference: .ai/audit/99-validation/02-config-validated-findings.md
source_section: CFG-001

description: >
  Fix the --config path resolution bug: resolve config_path against the
  caller's CWD before constructing TelepostConfigReader. Apply
  config_path.resolve() in app.py's _load_and_validate_config before
  passing to the reader.

goals:
  - documented --config flag works with relative paths
  - resolve at CLI layer, not in service layer

files:
  - path: src/mko_telepost/app.py
    targets:
      - type: function
        name: _load_and_validate_config
    semantic_anchors:
      insert_before:
        type: function_call
        value: TelepostConfigReader
    changes:
      - action: edit_code
        description: Resolve config_path against CWD before constructing reader
        code_hint: |
          if custom_config_path is not None:
              custom_config_path = custom_config_path.resolve()
          reader = TelepostConfigReader(config_path=custom_config_path)

acceptance_criteria:
  - relative --config paths resolve correctly against CWD
  - absolute paths still work (Path.resolve() is no-op for absolutes)
  - uv run ruff check passes
  - uv run mypy passes
  - tests pass