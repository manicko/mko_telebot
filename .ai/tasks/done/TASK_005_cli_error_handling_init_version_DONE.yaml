id: task_005_cli_error_handling_init_version

source_reference: .ai\audit\99-validation\01-cli-validated-findings.md
source_section: CLI-003

title: Add error handling to init and version commands

priority: medium

description: >
  CLI-003: `init` and `version` commands can leak raw tracebacks on edge-case errors.
  No `try/except` around `dst.mkdir()`, `shutil.copy2()` in init, or `pkg_version()`
  in version. This violates the "no raw tracebacks" rule.

goals:
  - Add `try/except OSError` to init command with user-friendly error message
  - Add `try/except PackageNotFoundError` to version command with error message
  - Exit with code 1 on failure for both commands

files:
  - path: src/mko_telebot/cli.py
    targets:
      - type: function
        name: init
      - type: function
        name: version
    semantic_anchors:
      - action: wrap_oserror_handler
        target: init
        around: dst.mkdir(), shutil.copy2()
      - action: wrap_package_not_found_handler
        target: version
        around: pkg_version("mko-telebot")

changes:
  - action: add_exception_handling
    description: >
      In init: wrap directory creation and file copying in try/except OSError.
      In version: wrap pkg_version in try/except PackageNotFoundError.
      Both print red ERROR message and exit code 1 on failure.

acceptance_criteria:
  - Init handles filesystem errors gracefully
  - Version handles missing package gracefully
  - No raw tracebacks on expected failure paths
  - Exit code 1 on error

tests_to_run:
  - uv run pytest tests/test_cli.py -v