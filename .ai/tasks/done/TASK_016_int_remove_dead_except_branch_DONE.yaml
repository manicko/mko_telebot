id: task_016_int_remove_dead_except_branch

source_reference: .ai\audit\99-validation\05-integrations-validated-findings.md
source_section: INT-005

title: Remove unreachable TelegramServiceError except branch in _fetch_messages

priority: low

description: >
  INT-005: `_fetch_messages` contains a dead `except TelegramServiceError` branch
  that can never execute. The try block only has Telethon async iteration, and
  Telethon never raises `TelegramServiceError`. That exception is only raised by
  the except RPCError block.

goals:
  - Remove the unreachable except branch
  - Clean up confusing exception handling structure

files:
  - path: src/mko_telebot/monitor_forward.py
    targets:
      - type: function
        name: _fetch_messages
    semantic_anchors:
      - action: remove_dead_except
        target: _fetch_messages
        lines: 239-241

changes:
  - action: remove_dead_code
    description: >
      Remove the `except TelegramServiceError` block after the RPCError handler.
      The RPCError handler already re-raises TelegramServiceError for caller to handle.

acceptance_criteria:
  - Dead except branch removed
  - No functional change in error handling
  - Code clarity improved

tests_to_run:
  - uv run pytest tests/test_monitor_forward.py -v