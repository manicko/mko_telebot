id: TASK_003_cfg_001_proxy_type_strenum
title: Create ProxyType StrEnum for proxy type validation
priority: medium

depends_on:
  - TASK_002

source_reference: .ai/audit/99-validation/02-config-validated.md
source_section: CFG-001
source_blocks:
  - "CFG-001: `proxy_type` field in ProxyConfig uses plain string instead of StrEnum"

description: >
  Create a ProxyType StrEnum to replace the plain string proxy_type field
  in ProxyConfig. This provides type safety, IDE autocomplete, and prevents
  typos. Update ProxyConfig.proxy_type to use this enum instead of a plain
  string with hardcoded validation.

goals:
  - Create ProxyType StrEnum with SOCKS5, SOCKS4, HTTP values
  - Update ProxyConfig.proxy_type to use ProxyType enum
  - Remove hardcoded string validation
  - Maintain backward compatibility with YAML config values

files:
  - path: src/mko_telebot/core/telethon.py
    targets:
      - type: class
        name: ProxyConfig
    semantic_anchors:
      - insert_after: class definition start
      - insert_before: proxy_type field

changes:
  - action: add_top_level
    description: Create ProxyType StrEnum before ProxyConfig class
    code_hint: |
      class ProxyType(StrEnum):
          SOCKS5 = "socks5"
          SOCKS4 = "socks4"
          HTTP = "http"
    target: ProxyConfig class
  - action: replace_in_body
    description: Update proxy_type field to use ProxyType enum
    code_hint: |
      proxy_type: ProxyType = Field(..., description="Proxy type")
    target: ProxyConfig class
  - action: delete_symbol
    description: Remove validate_proxy_type method (no longer needed with StrEnum)
    target: validate_proxy_type method

acceptance_criteria:
  - ProxyType StrEnum created with correct values
  - ProxyConfig.proxy_type uses ProxyType enum type
  - YAML configuration values still work (socks5, socks4, http strings)
  - Validation logic preserved via Pydantic's built-in enum validation
  - Tests pass

risk: medium
risk_justification: >
  Changes to configuration model affect user-facing configuration file format.
  Must ensure backward compatibility - YAML string values should still work
  with the StrEnum. The validator method removal requires verification that
  Pydantic's enum validation provides equivalent validation.