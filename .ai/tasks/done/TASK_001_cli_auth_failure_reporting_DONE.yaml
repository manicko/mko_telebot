id: task_001_cli_auth_failure_reporting

source_reference: .ai\audit\99-validation\01-cli-validated-findings.md
source_section: CLI-001

title: Report non-zero exit when Telegram auth fails

priority: high

depends_on:
  - task_002_int_fix_start_client_exceptions

description: >
  CLI-001: The `run` command reports silent success when Telegram auth fails.
  `start_client()` returns `False` on auth failure but `run_monitor()` has no else branch,
  and CLI never inspects the result. This violates meaningful exit codes requirement.

goals:
  - `run_monitor()` should raise `MkoTelebotError` when `start_client` returns `False`
  - CLI should surface auth failure to user with non-zero exit code
  - Preserve backward compatibility for successful auth flow

files:
  - path: src/mko_telebot/monitor_client.py
    targets:
      - type: function
        name: start_client
    semantic_anchors:
      - action: modify_exception_handling
        target: start_client
        detail: Ensure function returns False on auth failure (already exists, verify correct exception types)

  - path: src/mko_telebot/monitor.py
    targets:
      - type: function
        name: run_monitor
    semantic_anchors:
      - action: insert_after
        target: return_statement
        condition: if await start_client(...) succeeds
      - action: insert_before
        target: end_of_function
        condition: Add else branch for False return

  - path: src/mko_telebot/cli.py
    targets:
      - type: function
        name: run
    semantic_anchors:
      - action: wrap_exception
        target: asyncio.run(run_monitor(...))
      - action: catch_and_report
        exception: MkoTelebotError
        severity: auth_failure

acceptance_criteria:
  - Auth failure produces non-zero exit code
  - Error message is user-friendly (no raw traceback)
  - All existing tests continue to pass

tests_to_run:
  - uv run pytest tests/test_monitor.py -v -k "start_client"
  - uv run pytest tests/test_cli.py -v