id: task_022_qlt001

title: Replace Any with concrete type aliases across production modules

priority: medium

depends_on:
  - TASK_021_QLT008_delete_type_ignore_post_model

source_reference: .ai/audit/99-validation/08-quality-validated-findings.md
source_section: QLT-001

description: >
  Replace remaining Any usages with concrete types. Introduce a CellValue
  TypeAlias (str | int | float | bool | None) for Google Sheets cell values.
  Use dict[str, object] for YAML I/O boundaries. Use concrete types for
  Telethon kwargs.

goals:
  - eliminate Any from type signatures across 5 modules
  - make type contracts visible to mypy

files:
  - path: src/mko_telepost/core/types.py
    changes:
      - action: add_code
        description: Create CellValue type alias and shared types module
        code_hint: |
          from typing import TypeAlias
          CellValue: TypeAlias = str | int | float | bool | None

  - path: src/mko_telepost/core/gsheets_reader.py
    targets:
      - type: function
        name: get_sheet_data
    changes:
      - action: edit_code
        description: Change return to list[list[CellValue]]
        code_hint: def get_sheet_data(...) -> list[list[CellValue]]:

  - path: src/mko_telepost/core/post_processor.py
    targets:
      - type: function
        name: _extract_photo_paths
      - type: function
        name: _extract_text_value
      - type: function
        name: get_posts
    changes:
      - action: edit_code
        description: Change row/list types to use CellValue where applicable
        code_hint: row: list[CellValue] instead of list[Any]

  - path: src/mko_telepost/core/config_reader.py
    targets:
      - type: function
        name: _load_yaml
      - type: function
        name: _validate_settings
      - type: function
        name: load_logging_config
    changes:
      - action: edit_code
        description: Replace dict[str, Any] with dict[str, object] at YAML boundaries
        code_hint: def _load_yaml(...) -> dict[str, object]:

  - path: src/mko_telepost/core/utils.py
    targets:
      - type: function
        name: yaml_to_dict
    changes:
      - action: edit_code
        description: Replace dict[str, Any] | None with dict[str, object] | None
        code_hint: def yaml_to_dict(...) -> dict[str, object] | None:

  - path: src/mko_telepost/core/telegram_service.py
    targets:
      - type: function
        name: _try_send_message
    changes:
      - action: edit_code
        description: Replace dict[str, Any] for reply_to_kwargs with dict[str, InputReplyToMessage]
        code_hint: reply_to_kwargs: dict[str, InputReplyToMessage]

acceptance_criteria:
  - CellValue type alias created in core/types.py
  - No Any in gsheets_reader.py, post_processor.py, config_reader.py, utils.py signatures
  - dict[str, object] used for YAML boundaries
  - uv run mypy passes
  - uv run pytest tests/ passes