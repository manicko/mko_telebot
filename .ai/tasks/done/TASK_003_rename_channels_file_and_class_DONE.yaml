id: TASK_003_rename_channels_file_and_class

title: Rename chats_config.py → channels.py + ChatsConfig → ChannelsConfig

priority: high

depends_on: []

source_reference: .ai/plans/FILE_NAMING_RESEARCH.md
source_section: "5.1 — Files to Rename (Priority Order)"

extra_context: |
  This task merges recommendations from two research plans:

  FILE_NAMING_RESEARCH.md: Remove redundant "config" suffix →
    chats_config.py → chats.py

  MODELS_RESEARCH.md: Fix semantic naming — Telegram API uses "channel"
    terminology, not "chat". Rename ChatsConfig → ChannelsConfig and
    change YAML alias from MONITORING → CHANNELS.

  User decision: Use option 3 — combine both (clean file name +
    correct semantics). File becomes channels.py, class becomes
    ChannelsConfig.

  Current file: src/mko_telebot/core/chats_config.py (114 lines)
  - Docstring: "Pydantic models for per-channel monitoring configuration."
  - Classes: LogLevel (StrEnum), ChannelConfig, ChannelDefaults, ChatsConfig
  - Already uses fields named "channels" — only the container class name
    and file name are inconsistent.
  - __all__ = ["LogLevel", "ChannelConfig", "ChannelDefaults", "ChatsConfig"]

description: >
  Rename chats_config.py to channels.py AND rename ChatsConfig class to
  ChannelsConfig for semantic correctness. This is a combined change:
  (a) file rename to remove redundant "config" suffix
  (b) class rename because Telegram API uses "channel" terminology

goals:
  - rename file: chats_config.py → channels.py
  - rename class: ChatsConfig → ChannelsConfig
  - update strip_defaults_from_channels return type annotation from
    ChatsConfig → ChannelsConfig
  - update __all__ export: "ChatsConfig" → "ChannelsConfig"
  - preserve all other content unchanged
  - do NOT update any importers (handled by TASK_007, TASK_008, TASK_010)

files:
  - path: src/mko_telebot/core/chats_config.py

    targets:
      - type: file
        name: chats_config.py

      - type: class
        name: ChatsConfig

      - type: class
        name: ChatsConfig.strip_defaults_from_channels

    semantic_anchors:
      class_definition: ChatsConfig
      method_return_annotation: strip_defaults_from_channels(self) -> ChatsConfig
      __all__: __all__ = ["LogLevel", "ChannelConfig", "ChannelDefaults", "ChatsConfig"]

changes:
  - action: rename_file

    description: >
      Rename src/mko_telebot/core/chats_config.py →
      src/mko_telebot/core/channels.py.

    from_path: src/mko_telebot/core/chats_config.py
    to_path: src/mko_telebot/core/channels.py

  - action: rename_class

    description: >
      Rename class ChatsConfig → ChannelsConfig in the (now renamed)
      channels.py file.

    class_name: ChatsConfig
    new_name: ChannelsConfig

  - action: update_return_annotation

    description: >
      Update the return type annotation of strip_defaults_from_channels
      from ChatsConfig → ChannelsConfig.

    target: channels.py > ChatsConfig.strip_defaults_from_channels
    old: "def strip_defaults_from_channels(self) -> ChatsConfig:"
    new: "def strip_defaults_from_channels(self) -> ChannelsConfig:"

  - action: update___all__

    description: >
      Update __all__ export to reflect the renamed class.

    old: '__all__ = ["LogLevel", "ChannelConfig", "ChannelDefaults", "ChatsConfig"]'
    new: '__all__ = ["LogLevel", "ChannelConfig", "ChannelDefaults", "ChannelsConfig"]'

risk_assessment:
  level: medium
  reason: >
    Class rename ChatsConfig → ChannelsConfig affects all importers
    (core/__init__.py, core/models.py). YAML validation_alias will be
    updated separately in TASK_008. The file rename is straightforward.
    Risk is mitigated by dedicated import-update tasks that ensure no
    stale references remain.

acceptance_criteria:
  - src/mko_telebot/core/chats_config.py no longer exists
  - src/mko_telebot/core/channels.py exists with updated class name and __all__
  - ChatsConfig class renamed to ChannelsConfig in channels.py
  - strip_defaults_from_channels returns ChannelsConfig
  - all tests still pass after dependent import updates