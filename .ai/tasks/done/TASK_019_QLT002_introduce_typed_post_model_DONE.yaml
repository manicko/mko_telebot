id: task_019_qlt002

title: Introduce typed Post model for post data flow

priority: medium

depends_on:
  - TASK_018_CLI001_configure_logging_at_startup

source_reference: .ai/audit/99-validation/08-quality-validated-findings.md
source_section: QLT-002

description: >
  Introduce a typed Post dataclass/Pydantic model (txt: str, photos: list[Path])
  to replace the untyped list[list[Any]] positional pair flowing between
  PostProcessor.get_posts and TelegramService. Replace post[0]/post[1]
  index access with named attributes.

goals:
  - replace untyped list[list[Any]] with explicit Post model
  - make type contract visible to mypy
  - eliminate reordering hazard

files:
  - path: src/mko_telepost/core/task.py
    targets:
      - type: class
        name: Task
    changes:
      - action: add_code
        description: Add Post dataclass model with txt and photos fields
        code_hint: |
          @dataclass
          class Post:
              txt: str
              photos: list[Path]

  - path: src/mko_telepost/core/post_processor.py
    targets:
      - type: function
        name: get_posts
    changes:
      - action: edit_code
        description: Change return type from list[list[Any]] to list[Post] and build Post instances
        code_hint: |
          Return list[Post] instead of list[list[Any]].
          Build: Post(txt=txt_value, photos=valid_photos)

  - path: src/mko_telepost/core/telegram_service.py
    targets:
      - type: function
        name: _push_posts_to_queue
    changes:
      - action: edit_code
        description: Replace post[0]/post[1] with post.txt/post.photos
        code_hint: |
          txt=post.txt instead of txt=post[0]
          raw_photos = post.photos[:chat.max_photos] instead of post[1][...]

  - path: src/mko_telepost/core/telegram_service.py
    targets:
      - type: function
        name: _fetch_sheet_data
    changes:
      - action: edit_code
        description: Update granges_data type from dict[str, list[list[Any]]] to dict[str, list[Post]]

acceptance_criteria:
  - Post model defined with txt: str and photos: list[Path]
  - get_posts returns list[Post]
  - no post[0]/post[1] indexing remains in telegram_service.py
  - granges_data type updated through all methods
  - uv run mypy passes
  - uv run pytest tests/ passes