id: task_011_int_classify_retry_errors

source_reference: .ai\audit\99-validation\05-integrations-validated-findings.md
source_section: INT-003

title: Classify errors to only retry transient RPCErrors

priority: medium

depends_on:
  - task_002_int_fix_start_client_exceptions

description: >
  INT-003: `_send_with_retry()` retries all `RPCError` subclasses including permanent
  errors like `AuthKeyUnregisteredError`, `SessionExpiredError`, `UserIdInvalidError`.
  Should only retry transient errors (`FloodWaitError`, `ServerError`, `TimedOut`).

goals:
  - Classify errors as transient vs permanent
  - Only retry transient errors
  - Fail fast on permanent errors

files:
  - path: src/mko_telebot/monitor_forward.py
    targets:
      - type: function
        name: _send_with_retry
    semantic_anchors:
      - action: modify_exception_handling
        target: _send_with_retry
        line: 112-118

changes:
  - action: refine_exception_handling
    description: >
      Change except block to catch specific Telethon exceptions. Retry only
      FloodWaitError, ServerError, TimedOut. For others (AuthKeyUnregisteredError,
      SessionPasswordNeededError, etc.), log and raise immediately.

acceptance_criteria:
  - Transient errors are retried with backoff
  - Permanent errors fail immediately
  - No resource waste on futile retries
  - All tests pass

tests_to_run:
  - uv run pytest tests/test_monitor_forward.py -v