id: task_029_srv002

title: Remove dead get_cache_path and consolidate cache-key logic

priority: medium

depends_on:
  - TASK_028_DF001_widen_get_dir_content_extensions

source_reference: .ai/audit/99-validation/03-services-validated-findings.md
source_section: SRV-002
also: .ai/audit/99-validation/08-quality-validated-findings.md QLT-003

description: >
  Remove the dead get_cache_path method (no production callers). Add a
  private _get_cache_path helper with alpha-aware extension logic and
  have resize_image use it instead of inlining the digest. Remove the
  two test-only callers.

goals:
  - eliminate dead code (get_cache_path)
  - consolidate cache-key logic in one place
  - fix extension divergence between path computation and actual write

files:
  - path: src/mko_telepost/core/image_cache.py
    targets:
      - type: function
        name: get_cache_path
    changes:
      - action: delete_code
        description: Remove entire get_cache_path method

  - path: src/mko_telepost/core/image_cache.py
    targets:
      - type: class
        name: ImageCache
    semantic_anchors:
      insert_after:
        type: function
        name: __init__
    changes:
      - action: add_code
        description: Add private _get_cache_path method with alpha-aware extension
        code_hint: |
          def _get_cache_path(self, original_path: Path, alpha: bool = False) -> Path:
              posix = original_path.as_posix()
              digest = hashlib.sha256(posix.encode("utf-8")).hexdigest()[:16]
              ext = ".png" if alpha else ".jpg"
              return self.cache_dir / f"{digest}{ext}"

  - path: src/mko_telepost/core/image_cache.py
    targets:
      - type: function
        name: resize_image
    changes:
      - action: edit_code
        description: Replace inlined digest computation with self._get_cache_path call
        code_hint: |
          cache_path = self._get_cache_path(image_path, alpha=has_alpha)
          # Remove the old inline: posix = ... digest = ... ext = ...

  - path: tests/test_image_cache.py
    targets:
      - type: function
        name: test_get_cache_path
      - type: function
        name: test_get_cache_path_consistency
    changes:
      - action: delete_code
        description: Remove test_get_cache_path and test_get_cache_path_consistency tests

acceptance_criteria:
  - get_cache_path removed
  - _get_cache_path used by resize_image
  - no extension divergence between path computation and file write
  - test_get_cache_path and test_get_cache_path_consistency removed
  - uv run pytest tests/test_image_cache.py passes