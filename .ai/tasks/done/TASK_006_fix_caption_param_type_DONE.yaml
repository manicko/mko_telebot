id: TASK_006_fix_caption_param_type
title: Fix caption parameter type in send_file
priority: medium

depends_on:
  - task_005

source_reference: .ai\plans\IMPLEMENTATION_PLANS.md
source_section: Error 6

description: >
  Fix the caption parameter type mismatch in _send_with_retry.
  The current `caption=caption or None` evaluates to None when caption is empty string,
  but send_file() expects str | Sequence[str]. The caller already passes a stripped
  caption string that is guaranteed to be non-empty or empty string, not None.

goals:
  - Pass caption directly instead of caption or None
  - Pass type checking
  - Maintain same runtime behavior

files:
  - path: src/mko_telebot/monitor_forward.py
    targets:
      - type: function
        name: _send_with_retry
    semantic_anchors:
      insert_after:
        type: function_call
        value: send_file

changes:
  - action: modify_code
    description: >
      In _send_with_retry function, change:
      await client.send_file(target, msg_media, caption=caption or None, link_preview=False)
      TO:
      await client.send_file(target, msg_media, caption=caption, link_preview=False)

acceptance_criteria:
  - basedpyright passes on monitor_forward.py
  - ruff check passes on monitor_forward.py
  - messages forward with correct caption

tests_to_run:
  - uv run ruff check src/mko_telebot/monitor_forward.py
  - uv run basedpyright src/mko_telebot/monitor_forward.py