id: TASK_018_test_config_reader
title: "Wave 5 — Add config reader tests"
priority: medium
depends_on:
  - TASK_010_config_reader_refactor
  - TASK_011_core_init_update
source_reference: .ai/plans/01/PLAN_01_WAVE_05.md
source_section: "Task 5.2 — Add config reader tests"

description: >
  Create `tests/test_config_reader.py` with tests for TelepostConfigReader.
  Use tmp_path fixture. Test from_user_dir, load() with/without config files,
  validate_files, load_logging_config, merged config.yaml + secrets.yaml.

goals:
  - test from_user_dir creates reader with default paths
  - test load() raises ConfigError when config missing
  - test load() returns TelepostSettings with valid files
  - test validate_files returns errors for missing files
  - test load_logging_config loads config correctly
  - test merged config.yaml + secrets.yaml overlays properly

files:
  - path: tests/test_config_reader.py
    semantic_anchors:
      - type: function
        name: test_from_user_dir
      - type: function
        name: test_load_missing_config
      - type: function
        name: test_load_valid_config
      - type: function
        name: test_validate_files
      - type: function
        name: test_load_logging_config
      - type: function
        name: test_merged_config
    changes:
      - action: create
        description: Create test_config_reader.py with TelepostConfigReader tests

acceptance_criteria:
  - all 6+ test cases implemented
  - tmp_path used for temporary config fixturess
  - config.yaml with MONITORING section created
  - secrets.yaml with TELETHON_API section created
  - ruff check passes with no errors
  - mypy passes with no errors
  - all tests pass

tests_to_run:
  - uv run pytest tests/test_config_reader.py -v
  - uv run ruff check tests/test_config_reader.py
  - uv run mypy tests/test_config_reader.py