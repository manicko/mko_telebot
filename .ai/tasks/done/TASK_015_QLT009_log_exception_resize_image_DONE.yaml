id: task_015_qlt009

title: Log exception in ImageCache.resize_image outer except block

priority: low

depends_on:
  - TASK_014_CFG007_add_missing_bounds_humanization

source_reference: .ai/audit/99-validation/08-quality-validated-findings.md
source_section: QLT-009

description: >
  Add proper logging in resize_image's outer except Exception block that
  currently silently returns the original path when Image.open fails.

goals:
  - operators can trace silent fallbacks during posting
  - consistent with logging in cleanup_unused and telegram_poster.py

files:
  - path: src/mko_telepost/core/image_cache.py
    targets:
      - type: function
        name: resize_image
    semantic_anchors:
      insert_before:
        type: return_statement
        value: return image_path
    changes:
      - action: add_code
        description: Add logger.warning with file path in the outer except block
        code_hint: |
          except Exception as e:
              logger.warning("Failed to open image %s: %s; forwarding original", image_path, e)
              return image_path

acceptance_criteria:
  - outer except Exception block logs warning with image path and exception
  - no silent error swallowing for Image.open failures
  - uv run ruff check passes
  - uv run mypy passes
  - tests pass