id: task_013_cfg003

title: Add base_delay_seconds <= max_delay_seconds cross-field validator

priority: medium

depends_on:
  - TASK_012_SRV001_tighten_max_photos_to_10

source_reference: .ai/audit/99-validation/02-config-validated-findings.md
source_section: CFG-003

description: >
  Add a model_validator(mode="after") to HumanizationConfig asserting
  base_delay_seconds <= max_delay_seconds, so the delay seed cannot exceed
  the declared upper bound.

goals:
  - enforce semantic invariant on humanization delay
  - catch invalid configurations at load time

files:
  - path: src/mko_telepost/core/chat_models.py
    targets:
      - type: class
        name: HumanizationConfig
    semantic_anchors:
      insert_after:
        type: function
        name: validate_delay_bounds
    changes:
      - action: add_code
        description: Add model_validator checking base_delay_seconds <= max_delay_seconds
        code_hint: |
          @model_validator(mode="after")
          def validate_base_delay_upper_bound(self) -> Self:
              if self.base_delay_seconds > self.max_delay_seconds:
                  raise ValueError(
                      f"base_delay_seconds ({self.base_delay_seconds}) must not exceed "
                      f"max_delay_seconds ({self.max_delay_seconds})"
                  )
              return self

acceptance_criteria:
  - HumanizationConfig with base > max rejected at load time
  - valid configurations pass through unchanged
  - uv run ruff check passes
  - uv run mypy passes
  - uv run pytest tests/test_models.py passes