  The main_loop function in monitor.py accesses settings.monitoring.channels_delay, 
  settings.monitoring.channels, and settings.monitoring.stagger_start_seconds on lines 306-310. 
  However, TelepostSettings has only telethon and channels fields - no monitoring attribute exists. 
  This causes AttributeError at runtime. The correct access is settings.channels.*.

goals:
  - Fix runtime AttributeError in main_loop
  - Use correct attribute path settings.channels
  - Enable application to start successfully

files:
  - path: src/mko_telebot/monitor.py

    targets:
      - type: function
        name: main_loop

    semantic_anchors:
      replace_in:
        - type: attribute
          value: settings.monitoring.channels_delay
        - type: attribute
          value: settings.monitoring.channels
        - type: attribute
          value: settings.monitoring.stagger_start_seconds

changes:
  - action: replace_in_body
    description: |
      Change all settings.monitoring references to settings.channels in main_loop function.
      Lines 306-310 currently access:
      - settings.monitoring.channels_delay -> settings.channels.channels_delay
      - settings.monitoring.channels -> settings.channels.channels
      - settings.monitoring.stagger_start_seconds -> settings.channels.stagger_start_seconds

    code_hint: |
      channels_delay = settings.channels.channels_delay
      channels = settings.channels.channels
      stagger_start_seconds = settings.channels.stagger_start_seconds

