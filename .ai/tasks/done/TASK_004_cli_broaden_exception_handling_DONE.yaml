id: task_004_cli_broaden_exception_handling

source_reference: .ai\audit\99-validation\01-cli-validated-findings.md
source_section: CLI-002

title: Broaden exception handling in run command

priority: medium

depends_on:
  - task_002_int_fix_start_client_exceptions

description: >
  CLI-002: Overly narrow exception handling lets raw tracebacks escape `run`.
  Only `MkoTelebotError` and `KeyboardInterrupt` are caught, but Telethon can raise
  `ConnectionError`, `OSError`, `asyncio.TimeoutError`, and `telethon.errors.*`
  that propagate unhandled.

goals:
  - Wrap `asyncio.run()` body in broad exception handler
  - Map unexpected exceptions to user-friendly messages
  - Never leak raw tracebacks to the user

files:
  - path: src/mko_telebot/cli.py
    targets:
      - type: function
        name: run
    semantic_anchors:
      - action: wrap_exception_handler
        target: run
        add: except Exception as e block

changes:
  - action: add_exception_handler
    description: >
      Add broad `except Exception as e` that logs error and exits with code 1.
      Use logger to record the error, print user-friendly message via console.print.

acceptance_criteria:
  - All exceptions are caught and handled
  - No raw tracebacks visible to user
  - Exit code is non-zero on error
  - Existing tests pass

tests_to_run:
  - uv run pytest tests/test_cli.py -v -k "run"