id: task_012_qlt_str_enum_token_types

source_reference: .ai\audit\99-validation\08-quality-validated-findings.md
source_section: QLT-002

title: Replace raw string token types with TokenType StrEnum

priority: medium

description: >
  QLT-002: Parser uses raw string token types ("GROUP_START", "EXCLUDE", etc.) instead
  of `StrEnum`. This risks typos, lacks IDE autocomplete, and violates project rule
  for fixed values.

goals:
  - Introduce `TokenType(StrEnum)` for token constants
  - Replace all string literals with enum values
  - Enable type checking for token types

files:
  - path: src/mko_telebot/core/parser.py
    targets:
      - type: module
    semantic_anchors:
      - action: add_enum
        target: module_level
        name: TokenType
      - action: replace_string_literals
        target: all_token_usages
        values: ["GROUP_START", "EXCLUDE", "TERM", "GROUP_END"]

changes:
  - action: add_str_enum
    description: >
      Create `TokenType(StrEnum)` with TERM, OR, EXCLUDE, GROUP_START, GROUP_END.
      Update _tokenize to use `TokenType.GROUP_START` instead of `"GROUP_START"`.
      Update all token comparisons.

acceptance_criteria:
  - All token types use TokenType.StrEnum
  - No string literal tokens remain
  - IDE autocomplete works for token types
  - All tests pass

tests_to_run:
  - uv run pytest tests/test_parser.py -v
  - uv run ruff check src/mko_telebot/core/parser.py