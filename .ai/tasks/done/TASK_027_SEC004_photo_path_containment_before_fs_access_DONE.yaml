id: task_027_sec004

title: Move photo-path containment check before filesystem access

priority: low

depends_on:
  - TASK_026_QLT004_consume_coordinate_posting_return

source_reference: .ai/audit/99-validation/04-security-validated-findings.md
source_section: SEC-004

description: >
  Move the path containment check into _extract_photo_paths before any
  filesystem access (before get_dir_content call). This makes the
  "security: prevent probing" invariant true end-to-end.

goals:
  - validate containment before globbing the filesystem
  - honor the stated security invariant in the code

files:
  - path: src/mko_telepost/core/post_processor.py
    targets:
      - type: function
        name: _extract_photo_paths
    semantic_anchors:
      insert_before:
        type: function_call
        value: get_dir_content
    changes:
      - action: add_code
        description: Add containment check using _validate_photo_path's logic before get_dir_content
        code_hint: |
          resolved = base_dir / raw_entry
          allowed_resolved = self.photo_base_dir.resolve()
          if not resolved.is_relative_to(allowed_resolved):
              logger.warning("Photo path %s is outside allowed directory %s", resolved, allowed_resolved)
              return []
          raw = get_dir_content(raw_entry_resolved) if not resolved.is_dir() else ...

acceptance_criteria:
  - containment check runs before any get_dir_content call
  - paths outside photo_base_dir are rejected before filesystem probing
  - uv run ruff check passes
  - uv run mypy passes
  - tests pass