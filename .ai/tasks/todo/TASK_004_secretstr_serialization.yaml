# TASK_004_secretstr_serialization.yaml
# Mandatory fix — SecretStr api_hash passed to Telethon without serialization causes runtime error

id: TASK_004_secretstr_serialization

title: Unwrap SecretStr api_hash before passing to TelegramClient

priority: high

depends_on:
  - TASK_001_type_hints_monitor

source_reference: .ai/audit/99-validation/05-integrations-validated-findings.md
source_section: INT-002
source_blocks:
  - "INT-002: SecretStr api_hash not converted to string for Telethon API"

description: >
  The api_hash field in ClientConfig is defined as SecretStr, but create_client()
  passes it directly to TelegramClient without unwrapping. This causes a runtime
  type error. Add .get_secret_value() call or use model_dump(mode='json').

goals:
  - Unwrap SecretStr api_hash before passing to TelegramClient
  - Ensure type compatibility with Telethon API
  - Tests updated to verify SecretStr unwrapping

files:
  - path: src/mko_telebot/monitor.py

    targets:
      - type: function
        name: create_client

semantic_anchors:
  insert_after:
    type: function_call
    value: model_dump

changes:
  - action: modify_function_body
    description: Unwrap SecretStr api_hash before passing to TelegramClient
    code_hint: |
      # After client_config = settings.telethon.client.model_dump()
      if "api_hash" in client_config:
          client_config["api_hash"] = client_config["api_hash"].get_secret_value()

acceptance_criteria:
  - api_hash is string type when passed to TelegramClient
  - model_dump(mode='json') alternative considered for cleaner solution
  - Tests updated to verify SecretStr unwrapping (not plain strings)