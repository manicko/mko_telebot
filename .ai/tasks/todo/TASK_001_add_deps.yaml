id: TASK_001_add_deps
title: "Wave 1 — Add typer and rich dependencies"
priority: high
depends_on: []
source_reference: .ai/plans/01/PLAN_01_WAVE_01.md
source_section: "Task 1.1 — Add typer and rich dependencies"

description: >
  Add `typer>=0.12` and `rich>=13` to the `[project] dependencies` list in `pyproject.toml`.
  These are required for the CLI entry point and user-facing console output.

goals:
  - add typer>=0.12 to project dependencies
  - add rich>=13 to project dependencies
  - all existing tests pass after change

files:
  - path: pyproject.toml
    targets:
      - type: config_key
        name: project.dependencies
    changes:
      - action: append
        description: Append typer>=0.12 and rich>=13 to dependencies list
        code_hint: |
          "typer>=0.12",
          "rich>=13",

acceptance_criteria:
  - typer>=0.12 present in pyproject.toml [project] dependencies
  - rich>=13 present in pyproject.toml [project] dependencies
  - `uv pip list` confirms typer and rich are available
  - `uv run ruff check pyproject.toml` — no errors
  - all existing tests pass

tests_to_run:
  - uv run ruff check pyproject.toml
  - uv run pytest tests/ -x