# Empty keywords handling - SRV-002

id: TASK_012_srv_002_empty_keywords_forward_all
title: Handle empty keywords list as forward-all to match documented behavior
priority: high

depends_on:
  - TASK_005_df_003_history_days_validation

source_reference: .ai/audit/99-validation/03-services-validated.md
source_section: SRV-002
source_blocks:
  - "SRV-002: Empty keywords list prevents all forwarding"
  - "Recommendation Clarification for SRV-002"

description: >
  When a channel has an empty keywords list, any() on line 183 always
  evaluates to False, preventing all message forwarding. Documentation
  states "An empty list forwards all messages" - the implementation
  should honor this contract. Update the matching logic to treat empty
  keywords as forward-all.

goals:
  - Align code with documented behavior
  - Empty keywords = forward all messages
  - Preserve existing non-empty keyword matching

files:
  - path: src/mko_telebot/monitor_forward.py
    targets:
      - type: function
        name: process_messages

changes:
  - action: replace_in_body
    description: Update matching logic for empty keywords
    old_snippet: |
      if msg_text and any(search_match(msg_text, kw) for kw in task.keywords):
    new_snippet: |
      if msg_text and (not task.keywords or any(search_match(msg_text, kw) for kw in task.keywords)):
    target: process_messages

acceptance_criteria:
  - Empty keywords list allows all messages to forward
  - Non-empty keywords maintain existing AND-based matching
  - Tests verify empty keywords behavior
  - Documentation behavior now matches implementation

risk: medium
risk_justification: >
  Changes core message forwarding logic. The semantic change is clear:
  empty list = forward all, non-empty = keyword match. Must verify
  existing tests and ensure no regression in keyword matching behavior.