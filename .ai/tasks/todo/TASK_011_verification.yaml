id: TASK_011_verification

title: Verify — all renames, import updates, and documentation changes

type: verification

priority: high

depends_on:
  - TASK_005_documentation_update
  - TASK_006_update_cli_imports
  - TASK_007_update_core_init_imports
  - TASK_008_update_core_models
  - TASK_009_update_test_imports
  - TASK_010_update_yaml_templates

verifies:
  - TASK_001_rename_logging_setup
  - TASK_002_rename_telethon_models
  - TASK_003_rename_channels_file_and_class
  - TASK_004_rename_config_reader
  - TASK_005_documentation_update
  - TASK_006_update_cli_imports
  - TASK_007_update_core_init_imports
  - TASK_008_update_core_models
  - TASK_009_update_test_imports
  - TASK_010_update_yaml_templates

description: >
  Run the full validation suite to confirm all rename and import update
  tasks are correct. Checks:
  1. Lint (ruff) — no import errors, unused imports, or syntax issues
  2. Type check (mypy) — no missing imports or type errors
  3. Unit tests (pytest) — all existing tests pass, verifying the
     MONITORING→CHANNELS alias and all import paths
  4. Static verification — old filenames do not exist anywhere in src/

verification_steps:
  - lint: uv run ruff check src/mko_telebot/ tests/
  - type_check: uv run mypy src/mko_telebot/
  - test: uv run pytest tests/ -q
  - static_verify: >
      Verify old filenames are gone:
      Test-Path src/mko_telebot/logging_setup.py → should be False
      Test-Path src/mko_telebot/core/chats_config.py → should be False
      Test-Path src/mko_telebot/core/telethon_models.py → should be False
      Test-Path src/mko_telebot/core/config_reader.py → should be False
  - import_verify: >
      Verify no stale imports remain:
      Select-String -Path src/mko_telebot/cli.py -Pattern "logging_setup|config_reader" → should be empty
      Select-String -Path src/mko_telebot/core/__init__.py -Pattern "chats_config|config_reader" → should be empty
      Select-String -Path src/mko_telebot/core/models.py -Pattern "chats_config|MONITORING|monitoring:" → should be empty
      Select-String -Path tests/ -Pattern "config_reader|MONITORING" → should be empty

pass_criteria:
  - ruff check passes with no errors
  - mypy type check passes with no errors
  - all pytest tests pass
  - old filenames no longer exist
  - no stale import references to renamed modules

failure_action: >
  If lint/type/test fails, identify which task introduced the error and
  return it to rework. Stale import references point to the consumer
  update task that missed a reference.