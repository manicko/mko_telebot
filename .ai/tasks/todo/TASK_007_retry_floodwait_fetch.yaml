id: task_007_retry_floodwait_fetch

title: Retry message fetch after FloodWaitError

priority: high

depends_on: [task_006_wrap_rpcerror_telegram_service]

description: >
  In _fetch_messages (monitor_forward.py:241-244), a FloodWaitError is caught,
  the code sleeps, and returns [] without retrying. The caller process_task sees
  an empty list and logs "no new messages found" but never retries the fetch,
  dropping the entire scan window. Add bounded retry after flood wait sleep,
  consistent with _send_with_retry retry policy.

goals:
  - retry client.iter_messages after FloodWaitError sleep
  - bounded retry prevents infinite loops
  - consistent with send path retry behavior

files:
  - path: src/mko_telebot/monitor_forward.py
    targets:
      - type: function
        name: _fetch_messages
    semantic_anchors:
      replace_in_body:
        - type: exception_handler
          value: except FloodWaitError as e: ... return []

changes:
  - action: add_code
    description: >
      Replace return [] with retry loop after sleep
    code_hint: |
      except FloodWaitError as e:
          await asyncio.sleep(e.seconds + random.uniform(10, 15))
          # Retry with exponential backoff, max_retries times

acceptance_criteria:
  - _fetch_messages retries after FloodWaitError
  - bounded retry prevents cascading flood waits
  - tests pass

tests_to_run:
  - uv run pytest tests/test_monitor_forward.py -v -k flood_wait