id: TASK_002_cfg_remove_utf8_bom

title: Remove UTF-8 BOM from keyw_config_example_keep.yaml

priority: medium

status: pending

depends_on: []

description: >
  Remove the UTF-8 BOM (Byte Order Mark) from src/mko_telebot/settings/keyw_config_example_keep.yaml.
  The file currently starts with bytes 0xef 0xbb 0xbf which represents an unnecessary BOM
  that can cause issues with some tools.

goals:
  - Remove UTF-8 BOM from template file
  - Ensure standard UTF-8 encoding without BOM
  - Maintain compatibility with existing YAML loading

files:
  - path: src/mko_telebot/settings/keyw_config_example_keep.yaml

    semantic_anchors:
      insert_before:
        type: yaml_document_start

changes:
  - action: replace_value
    description: >
      Rewrite file as UTF-8 without BOM using appropriate tool or encoding

    code_hint: |
      # Use encoding='utf-8' instead of 'utf-8-sig' when reading
      # Remove EF BB BF bytes from file start

acceptance_criteria:
  - File starts with '#' comment, not BOM bytes
  - File loads successfully with standard UTF-8 encoding
  - Existing tests pass