id: task_016_update_docs_auth_failure

title: Update CLI docs for auth failure behavior (terminates not continues)

priority: low

depends_on: []

description: >
  Documentation states auth failure "continues for other channels" but actual code
  raises TelegramAuthError and terminates. Update cli-reference.md to accurately
  describe that authentication failure terminates the entire run.

goals:
  - correct cli-reference.md error handling table for auth failure
  - document that auth failure terminates run

files:
  - path: docs/99-reference/cli-reference.md
    targets:
      - type: section
        name: Error Handling

changes:
  - action: replace_value
    description: >
      Change "loop continues for other channels" to "terminates the run"
    code_hint: |
      # Line 173: update auth failure behavior description

acceptance_criteria:
  - cli-reference.md shows auth failure terminates run
  - Documentation matches code behavior

tests_to_run: []