id: task_012_await_client_disconnect

title: Await client.disconnect() and add reconnect wrapper

priority: low

depends_on: [task_006_wrap_rpcerror_telegram_service]

description: >
  run_monitor calls client.disconnect() without await in finally block. Telethon's
  disconnect() is a coroutine; calling without await schedules but doesn't guarantee
  cleanup. Also, no reconnect logic exists for transient disconnections. Add await
  and wrap process_task in reconnect handler.

goals:
  - properly await client.disconnect() in finally block
  - add reconnect-on-error wrapper for process_task
  - improve operational reliability

files:
  - path: src/mko_telebot/monitor.py
    targets:
      - type: function
        name: run_monitor
    semantic_anchors:
      replace_in_body:
        - type: statement
          value: client.disconnect()

  - path: src/mko_telebot/monitor.py
    targets:
      - type: function
        name: process_task
    semantic_anchors:
      insert_after:
        type: function_call
        value: client

changes:
  - action: add_code
    description: >
      Change to await client.disconnect(); add reconnect wrapper in main_loop
    code_hint: |
      finally:
          await client.disconnect()

acceptance_criteria:
  - disconnect is properly awaited
  - transient disconnects trigger reconnect attempt
  - tests pass

tests_to_run:
  - uv run pytest tests/test_monitor.py -v