# Include media captions in keyword matching - SRV-001

id: TASK_013_srv_001_media_captions_matching
title: Include media captions in keyword matching for messages with media
priority: high

depends_on:
  - TASK_012_srv_002_empty_keywords_forward_all

source_reference: .ai/audit/99-validation/03-services-validated.md
source_section: SRV-001
source_blocks:
  - "SRV-001: Media captions excluded from keyword matching"

description: >
  Messages with media (photos/videos) that have captions containing matching
  keywords are not forwarded if msg.message is empty. The process_messages
  function only collects msg.message for keyword matching text, ignoring
  msg.media.caption entirely. Include media captions in the keyword matching
  text by extracting msg.media.caption alongside msg.message.

goals:
  - Extract media captions for keyword matching
  - Forward messages with keyword-matching captions
  - Handle cases where msg.message is empty but media has caption

files:
  - path: src/mko_telebot/monitor_forward.py
    targets:
      - type: function
        name: process_messages

changes:
  - action: replace_in_body
    description: Include media caption in keyword matching text
    old_snippet: |
      msg_text = msg.message
      msg_media = msg.media
    new_snippet: |
      msg_text = msg.message or ""
      if msg.media and hasattr(msg.media, 'caption') and msg.media.caption:
          msg_text = (msg_text + " " + msg.media.caption).strip() if msg_text else msg.media.caption
      msg_media = msg.media
    target: process_messages

acceptance_criteria:
  - Media captions are included in keyword matching
  - Messages with caption-only keywords are forwarded
  - Empty media caption handled gracefully
  - Tests verify caption matching behavior

risk: medium
risk_justification: >
  Extends keyword matching behavior to include caption text. Must ensure
  caption extraction doesn't break when media lacks caption attribute or
  caption is None. Changes core message processing logic.