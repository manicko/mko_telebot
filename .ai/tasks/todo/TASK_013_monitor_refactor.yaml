id: TASK_013_monitor_refactor
title: "Wave 4 — Refactor monitor.py (remove import-time side effects)"
priority: high
status: pending
depends_on:
  - TASK_010_config_reader_refactor
  - TASK_012_task_refactor
source_reference: .ai/plans/01/PLAN_01_WAVE_04.md
source_section: "Task 4.1 — Refactor monitor.py"

description: >
  Refactor `src/mko_telebot/monitor.py` to remove all import-time side effects.
  Remove module-level logging.config.dictConfig(), TelegramClient creation,
  asyncio.Queue(), asyncio.Lock(), and config mutation. Create create_client()
  helper function. Functions accept TelegramClient and TelepostSettings as parameters.
  Replace broad except Exception with specific error types from errors.py.

goals:
  - remove all module-level side effects (dictConfig, client creation, queue, lock, config mutation)
  - only imports, logger, type/function references remain at module level
  - create create_client(settings) -> TelegramClient helper
  - start_client accepts TelegramClient parameter
  - run_monitor(settings, client) replaces launcher
  - main_loop accepts settings and client
  - replace bare except Exception with TelegramAuthError, TelegramServiceError
  - import from new paths, models, errors modules

files:
  - path: src/mko_telebot/monitor.py
    targets:
      - type: function
        name: create_client
      - type: function
        name: start_client
      - type: function
        name: run_monitor
      - type: function
        name: main_loop
      - type: function
        name: launcher
      - type: import
        name: from mko_telebot.core import CONFIG
    semantic_anchors:
      - type: function
        name: create_client
      - type: function
        name: run_monitor
    changes:
      - action: remove
        description: Remove module-level CONFIG import and all config references
      - action: remove
        description: Remove module-level TelegramClient(), asyncio.Queue(), asyncio.Lock() creation
      - action: remove
        description: Remove module-level logging.config.dictConfig() call
      - action: add
        description: Add create_client(settings) helper function
      - action: update
        description: Update start_client, main_loop, process_and_reschedule to accept client parameter
      - action: update
        description: Replace bare except Exception with specific error types

acceptance_criteria:
  - no module-level code except imports and logger = logging.getLogger(__name__)
  - create_client(settings) returns TelegramClient using APP_PATHS.session_dir
  - start_client(client: TelegramClient) returns bool
  - run_monitor(settings, client) is main entry point
  - main_loop(settings, client, queue) exists
  - CONFIG references replaced with settings parameter access
  - ruff check passes with no errors
  - mypy passes with no errors

tests_to_run:
  - uv run ruff check src/mko_telebot/monitor.py
  - uv run mypy src/mko_telebot/monitor.py