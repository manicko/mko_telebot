id: TASK_012_tst_parser_unit_tests

title: Add unit tests for parser module (PatternParser, parse_query, AST nodes)

priority: medium

status: pending

depends_on: []

description: >
  Add dedicated unit tests for PatternParser and parse_query in parser.py,
  plus AST node classes in ast_nodes.py. Current tests only cover search_match
  indirectly. Need tests for tokenization, parsing, and AST node types.

goals:
  - Test PatternParser tokenization edge cases
  - Test parse_query with various query strings
  - Test AST node types (ExactMatch, Wildcard, Exclusion, Sequence, OrOperation)
  - Test nested parentheses handling
  - Test malformed query rejection

files:
  - path: tests/test_parser.py

    targets:
      - type: test_class
        name: TestPatternParser
      - type: test_class
        name: TestParseQuery
      - type: test_class
        name: TestASTNodes

changes:
  - action: add_top_level
    description: >
      Create test classes for parser module functions and classes

    code_hint: |
      # TestPatternParser covers:
      # - tokenization of patterns
      # - edge cases in token parsing
      # - error handling for invalid tokens
      
      # TestParseQuery covers:
      # - simple queries (exact match, wildcard)
      # - negation (!pattern)
      # - alternation (a|b)
      # - grouping ((a|b)&c)
      # - malformed queries
      
      # TestASTNodes covers:
      # - ExactMatch creation and regex conversion
      # - Wildcard pattern matching
      # - Exclusion negation logic
      # - Sequence concatenation
      # - OrOperation alternation

acceptance_criteria:
  - All new tests pass
  - PatternParser test coverage >= 80%
  - parse_query test coverage >= 80%
  - AST node test coverage >= 80%