id: task_009_cli_exit_code_keyboardinterrupt

source_reference: .ai\audit\99-validation\01-cli-validated-findings.md
source_section: CLI-005

title: Use Unix convention exit code 130 for KeyboardInterrupt

priority: low

description: >
  CLI-005: `run` exits 0 on KeyboardInterrupt. Unix convention uses 128+signal (130
  for SIGINT) to distinguish intentional interruption. This aids process supervisors.

goals:
  - Change exit code from 0 to 130 for KeyboardInterrupt
  - Follow Unix convention for signal-based exits

files:
  - path: src/mko_telebot/cli.py
    targets:
      - type: function
        name: run
    semantic_anchors:
      - action: change_exit_code
        target: run
        line: 102
        old: raise typer.Exit(code=0)
        new: raise typer.Exit(code=130)

acceptance_criteria:
  - KeyboardInterrupt produces exit code 130
  - Process supervisors can distinguish intentional interruption
  - All tests pass

tests_to_run:
  - uv run pytest tests/test_cli.py -v -k "keyboardinterrupt or interrupt"