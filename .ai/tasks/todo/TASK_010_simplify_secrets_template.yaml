# TASK_010_simplify_secrets_template.yaml
# Advisory fix — Remove optional language fields from secrets template

id: TASK_010_simplify_secrets_template

title: Remove optional fields from secrets.yaml template

priority: low

depends_on: []

source_reference: .ai/audit/99-validation/04-security-validated-findings.md
source_section: SEC-004
source_blocks:
  - "SEC-004: Secrets template exposes internal configuration structure"

description: >
  Remove system_lang_code and lang_code from secrets.yaml template. These optional
  fields belong in config.yaml if needed, not in the secrets template alongside
  API credentials.

goals:
  - Keep secrets focused on credentials only
  - Remove optional language configuration fields
  - Reduce risk of accidental secret exposure

files:
  - path: src/mko_telebot/settings/secrets.yaml

semantic_anchors:
  replace_content: true

changes:
  - action: delete_keys
    description: Remove system_lang_code and lang_code from secrets template
    target_keys:
      - system_lang_code
      - lang_code

acceptance_criteria:
  - secrets.yaml contains only credential fields
  - Template follows principle of minimal secrets
  - No validation errors