id: TASK_004_task_no_sidefx
title: "Wave 1 — Remove import-time side effects from task.py"
priority: high
depends_on: []
source_reference: .ai/plans/01/PLAN_01_WAVE_01.md
source_section: "Task 1.4 — Remove import-time side effects from task.py"

description: >
  Remove the import-time side effect in `src/mko_telebot/core/task.py` where
  `logging.config.dictConfig(CONFIG.LOGGING.model_dump())` is called at module level.
  Remove `import logging.config`. Keep imports of CONFIG and PATHS (still needed).

goals:
  - remove module-level logging.config.dictConfig() call
  - remove import logging.config
  - keep all other imports (CONFIG, PATHS, utils, logging)
  - keep state_dir = Path(PATHS.state_dir)

files:
  - path: src/mko_telebot/core/task.py
    targets:
      - type: import
        name: import logging.config
    semantic_anchors:
      - type: code_block
        name: module-level dictConfig call
    changes:
      - action: remove
        description: Remove import logging.config
      - action: remove
        description: Remove module-level logging.config.dictConfig() call

acceptance_criteria:
  - import logging.config removed from task.py
  - logger = logging.getLogger(__name__) remains
  - from mko_telebot.core import CONFIG remains
  - from mko_telebot.core import PATHS remains
  - state_dir = Path(PATHS.state_dir) remains
  - ruff check passes with no errors
  - mypy passes with no errors

tests_to_run:
  - uv run ruff check src/mko_telebot/core/task.py
  - uv run mypy src/mko_telebot/core/task.py