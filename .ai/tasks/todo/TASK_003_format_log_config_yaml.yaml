id: task_003_format_log_config_yaml

title: Convert log_config.yaml to standard block-style YAML

priority: low

depends_on: []

description: >
  log_config.yaml uses JSON-style flow mappings ({...}) with inline # comments, which
  is non-standard YAML style. PyYAML's safe_load currently tolerates it, but this is
  fragile and inconsistent with other config files. Rewrite in standard block-style YAML
  to match config.yaml/telethon_config.yaml conventions.

goals:
  - rewrite log_config.yaml in block-style YAML format
  - remove JSON-style braces and inline comments
  - maintain same configuration functionality

files:
  - path: src/mko_telebot/settings/log_config.yaml
    targets: []

  - path: src/mko_telebot/core/config.py
    targets:
      - type: method
        name: load_logging_config
    semantic_anchors:
      insert_after:
        type: function_call
        value: _load_yaml

acceptance_criteria:
  - log_config.yaml uses block-style YAML syntax
  - yaml.safe_load continues to parse correctly
  - tests pass

tests_to_run:
  - uv run pytest tests/test_config_reader.py -v -k logging