id: task_022_research_windows_acl_approach

title: Research Windows ACL approach for session/credential file hardening

priority: high

type: research

status: pending

description: >
  Investigate the best approach for implementing Windows file ACL hardening for
  .session auth-key files and credential config files. On Windows, os.chmod ignores
  Unix permission bits. Need to determine: pywin32 dependency vs ctypes solution,
  cross-platform fallback strategy, and impact on project dependencies.

research_questions:
  - Which package provides simplest cross-platform file permission hardening?
  - Is pywin32 already a transitive dependency?
  - What fallback behavior is acceptable if ACL tools unavailable?
  - Test verification strategy on Windows dev machines

deliverables:
  - go/no-go recommendation for Windows ACL implementation
  - Recommended technical approach (pywin32, ctypes, or external tool)
  - Dependency impact assessment

blocking:
  - task_004_secure_session_file_windows
  - task_005_credential_file_hardening_cross_platform