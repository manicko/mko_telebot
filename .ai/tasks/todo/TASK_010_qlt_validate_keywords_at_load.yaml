id: task_010_qlt_validate_keywords_at_load

source_reference: .ai\audit\99-validation\08-quality-validated-findings.md
source_section: QLT-001
related_findings:
  - SRV-004: Keywords validation (same fix, duplicate)

title: Validate keywords at config load time

priority: medium

description: >
  QLT-001/SRV-004: `search_match` swallows all exceptions and returns `False`. Misspelled
  or malformed keywords in config silently fail to match. Should validate at config-load
  time via Pydantic validator instead.

goals:
  - Add field_validator for keywords in ChannelConfig
  - Validate keyword syntax at config load time
  - Raise ConfigError on invalid keywords
  - Remove broad except Exception in search_match (optional cleanup)

files:
  - path: src/mko_telebot/core/channels.py
    targets:
      - type: class
        name: ChannelConfig
    semantic_anchors:
      - action: add_keyword_validator
        target: ChannelConfig
        field: keywords

  - path: src/mko_telebot/core/matcher.py
    targets:
      - type: function
        name: search_match
    semantic_anchors:
      - action: remove_broad_exception_handler
        target: search_match
        optional: After config validation, broad handler becomes unnecessary

changes:
  - action: add_validator
    description: >
      Add `field_validator("keywords")` in `ChannelConfig` that calls `parse_query`
      for each keyword and raises `ConfigError` on syntax errors.

acceptance_criteria:
  - Invalid keywords fail at startup with clear error
  - Valid keywords work correctly
  - No silent keyword failures at runtime
  - All tests pass

tests_to_run:
  - uv run pytest tests/test_config_reader.py -v
  - uv run pytest tests/test_parser.py -v