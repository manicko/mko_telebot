# Improve FloodWaitError test setup - INT-002

id: TASK_019_int_002_floodwait_test_improvement
title: Update FloodWaitError test setup to use realistic wait times
priority: low

depends_on:
  - TASK_016_qlt_001_sequence_type

source_reference: .ai/audit/99-validation/05-integrations-validated.md
source_section: INT-002
source_blocks:
  - "INT-002: FloodWaitError seconds value defaults to 0 in test setup"
  - "Recommendation Clarification for INT-002"

description: >
  Tests instantiate FloodWaitError without the capture parameter, resulting in
  e.seconds == 0. Update tests to use FloodWaitError(request=None, capture=30)
  or similar to verify actual wait time handling with realistic values.

goals:
  - Verify realistic wait time handling in tests
  - Improve test quality for edge case coverage

files:
  - path: tests/test_monitor_forward.py
    targets:
      - type: function
        name: test_process_task_retries_on_flood_wait
  - path: tests/test_monitor_forward.py
    targets:
      - type: function
        name: test_process_task_continues_after_flood_wait
  - path: tests/test_monitor_forward.py
    targets:
      - type: function
        name: test_process_task_holds_on_worker_busy
  - path: tests/test_monitor_forward.py
    targets:
      - type: function
        name: test_process_task_holds_on_rpcretryerror
  - path: tests/test_monitor.py
    targets:
      - type: function
        name: test_send_with_retry_handles_errors

changes:
  - action: replace_in_body
    description: Use FloodWaitError(request=None, capture=30) instead of default constructor
    old_snippet: 'raise FloodWaitError(request=None)'
    new_snippet: 'raise FloodWaitError(request=None, capture=30)'
    target: test_process_task_retries_on_flood_wait
  - action: replace_in_body
    description: Apply same fix to other test locations
    old_snippet: 'FloodWaitError(request=None), None'
    new_snippet: 'FloodWaitError(request=None, capture=30), None'
    target: test_process_task_continues_after_flood_wait and related tests

acceptance_criteria:
  - FloodWaitError created with capture=30 for realistic wait testing
  - Tests verify wait time handling with non-zero seconds value
  - All tests continue to pass

risk: low
risk_justification: >
  Test improvement only. Uses capture parameter which sets the seconds value.
  No production code changes, only test quality enhancement.