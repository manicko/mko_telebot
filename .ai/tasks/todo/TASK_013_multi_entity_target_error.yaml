id: task_013_multi_entity_target_error

title: Raise explicit error for ambiguous multi-entity targets

priority: high

depends_on: []

description: >
  When a forward target resolves to multiple entities (Telethon returns a list),
  resolve_targets_entities silently continues with no notification. The target is
  then absent from forward_to_users, causing silent missed-forwards. Replace the
  silent continue with TelegramServiceError to provide operator visibility and
  trigger proper rescheduling.

goals:
  - replace silent continue with TelegramServiceError for list result
  - ensure operator visibility for ambiguous targets
  - trigger rescheduling instead of silent drop

files:
  - path: src/mko_telebot/core/task.py
    targets:
      - type: function
        name: resolve_targets_entities
    semantic_anchors:
      replace_in_body:
        - type: statement
          value: if isinstance(result, list): continue

changes:
  - action: add_code
    description: >
      Replace continue with raise TelegramServiceError for ambiguous target
    code_hint: |
      if isinstance(result, list):
          raise TelegramServiceError(f"Ambiguous target '{ent}' resolved to multiple entities")

acceptance_criteria:
  - Ambiguous targets raise TelegramServiceError
  - Error is logged with target name
  - Task is rescheduled after error
  - Tests pass

tests_to_run:
  - uv run pytest tests/test_task.py -v -k resolve_targets