id: TASK_017_test_errors
title: "Wave 5 — Add error hierarchy tests"
priority: medium
depends_on:
  - TASK_002_create_errors
source_reference: .ai/plans/01/PLAN_01_WAVE_05.md
source_section: "Task 5.1 — Add error hierarchy tests"

description: >
  Create `tests/test_errors.py` with tests for the exception hierarchy:
  inheritance, ConfigError path parameter, exception polymorphism, message preservation.

goals:
  - test MkoTelebotError inherits from Exception
  - test all subclasses inherit from MkoTelebotError
  - test ConfigError accepts optional path parameter
  - test exceptions can be caught as MkoTelebotError
  - test exception messages are preserved

files:
  - path: tests/test_errors.py
    semantic_anchors:
      - type: function
        name: test_mko_telebot_error_inheritance
      - type: function
        name: test_config_error_path
      - type: function
        name: test_exception_polymorphism
    changes:
      - action: create
        description: Create test_errors.py with exception hierarchy tests

acceptance_criteria:
  - all 5 exception classes tested for inheritance
  - ConfigError path parameter tested
  - exception polymorphism tested (catch as base class)
  - ruff check passes with no errors
  - all tests pass

tests_to_run:
  - uv run pytest tests/test_errors.py -v
  - uv run ruff check tests/test_errors.py