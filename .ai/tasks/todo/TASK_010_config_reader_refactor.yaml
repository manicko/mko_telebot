source_section: "Task 3.1 — Refactor config_reader.py"

description: >
  Rewrite `src/mko_telebot/core/config_reader.py` to use the new typed Pydantic models
  with lazy loading via TelepostConfigReader. Remove module-level CONFIG and PATHS singletons.
  Remove old Config, MonitoringSettings, LoggingSettings, TelethonApiSettings, WorkingPaths classes.
  Raise ConfigError on validation failures.

goals:
  - remove module-level CONFIG singleton (no import-time I/O)
  - remove module-level PATHS singleton (now in paths.py)
  - remove old dict-based Config, MonitoringSettings, LoggingSettings, TelethonApiSettings, WorkingPaths
  - create TelepostConfigReader with load(), load_logging_config(), validate_files(), from_user_dir()
  - merge config.yaml (MONITORING) + secrets.yaml (TELETHON_API)
  - raise ConfigError from errors.py on failures
  - keep resolve_path utility function

files:
  - path: src/mko_telebot/core/config_reader.py
    targets:
      - type: class
        name: Config
      - type: class
        name: MonitoringSettings
      - type: class
        name: LoggingSettings
      - type: class
        name: TelethonApiSettings
      - type: class
        name: WorkingPaths
      - type: variable
        name: CONFIG
      - type: variable
        name: PATHS
    semantic_anchors:
      - type: class
        name: TelepostConfigReader
    changes:
      - action: replace
        description: Replace old Config class with TelepostConfigReader
      - action: remove
        description: Remove old dict-based settings classes
      - action: remove
        description: Remove module-level CONFIG and PATHS singletons
      - action: update
        description: Update __all__

acceptance_criteria:
  - TelepostConfigReader exists with load(), load_logging_config(), validate_files(), from_user_dir() methods
  - no module-level CONFIG or PATHS singletons
  - ConfigError raised for missing/bad config files
  - resolve_path helper remains
  - ruff check passes with no errors
  - mypy passes with no errors

tests_to_run:
  - uv run ruff check src/mko_telebot/core/config_reader.py
  - uv run mypy src/mko_telebot/core/config_reader.py