id: task_001_fix_validate_schema

title: Fix validate command to perform schema validation

priority: high

depends_on: []

description: >
  The validate CLI command (cli.py:validate) currently only checks file existence via
  validate_files(), but documentation states it should validate that configuration files
  "exist and are valid". Make validate invoke reader.load() (or a schema-validate method)
  so invalid configs are caught before run.

goals:
  - invoke Pydantic schema validation in validate command
  - catch invalid YAML content before run command
  - close false-confidence gap in validate

files:
  - path: src/mko_telebot/cli.py
    targets:
      - type: function
        name: validate
    semantic_anchors:
      insert_after:
        type: function_call
        value: reader.validate_files

  - path: src/mko_telebot/core/config.py
    targets:
      - type: method
        name: validate_files
    semantic_anchors:
      insert_before:
        type: return_statement

changes:
  - action: add_code
    description: >
      Call reader.load() after validate_files() to perform Pydantic schema validation
    code_hint: |
      # After validate_files success, invoke load to validate schema
      try:
          reader.load()
      except ConfigError as e:
          logger.error("Configuration schema validation failed")
          raise typer.Exit(code=1)

acceptance_criteria:
  - validate command catches invalid config.yaml schema
  - validate command catches invalid telethon_config.yaml schema
  - tests pass

tests_to_run:
  - uv run pytest tests/test_config_reader.py -v
  - uv run pytest tests/test_cli.py -v -k validate