id: task_015_update_docs_exit_code

title: Update CLI docs for Ctrl+C exit code (130 not 0)

priority: low

depends_on: []

description: >
  Documentation at cli-reference.md line 172 states Ctrl+C exits with code 0, but
  cli.py raises typer.Exit(code=130). Exit code 130 (128 + SIGINT signal 2) is the
  standard Unix convention. Update documentation to match actual behavior.

goals:
  - correct cli-reference.md exit code table for Ctrl+C
  - document 130 as standard Unix convention

files:
  - path: docs/99-reference/cli-reference.md
    targets:
      - type: section
        name: Exit Codes

changes:
  - action: replace_value
    description: >
      Change "exits gracefully with code 0" to "exits gracefully with code 130"
    code_hint: |
      # Line 172: "exits gracefully with code 0" → "exits gracefully with code 130"

acceptance_criteria:
  - cli-reference.md shows exit code 130 for Ctrl+C
  - cli-reference.md documents Unix convention rationale

tests_to_run: []