id: TASK_010_update_yaml_templates

title: Update YAML config templates — MONITORING → CHANNELS

priority: high

depends_on:
  - TASK_003_rename_channels_file_and_class

source_reference: .ai/plans/MODELS_RESEARCH.md
source_section: "4 — Files to Modify"

extra_context: |
  Two YAML template files use the "MONITORING" key which must change
  to "CHANNELS" to match the new validation_alias in TelepostSettings:

  1. src/mko_telebot/settings/config.yaml (18 lines)
     - Line 2: MONITORING: { → CHANNELS: {

  2. src/mko_telebot/settings/keyw_config_example_keep.yaml (36 lines)
     - Line 5: MONITORING: { → CHANNELS: {

  These files serve as template/config examples shipped with the package.
  The docs/11-guides/configuration.md already uses "MONITORING" in
  examples — its examples should be updated too for consistency.

description: >
  Update YAML template files and documentation examples to use the new
  "CHANNELS" key instead of "MONITORING":
  1. src/mko_telebot/settings/config.yaml
  2. src/mko_telebot/settings/keyw_config_example_keep.yaml
  3. docs/11-guides/configuration.md YAML examples

goals:
  - update config.yaml: MONITORING → CHANNELS
  - update keyw_config_example_keep.yaml: MONITORING → CHANNELS
  - update configuration guide YAML examples: MONITORING → CHANNELS
  - ensure backward-compatible YAML parsing with new key
  - keep all other YAML content unchanged

files:
  - path: src/mko_telebot/settings/config.yaml

    targets:
      - type: dict_key
        name: MONITORING

    semantic_anchors:
      line_2: "MONITORING: {"

    changes:
      - action: replace_text
        old: "MONITORING: {"
        new: "CHANNELS: {"

  - path: src/mko_telebot/settings/keyw_config_example_keep.yaml

    targets:
      - type: dict_key
        name: MONITORING

    semantic_anchors:
      line_5: "MONITORING: {"

    changes:
      - action: replace_text
        old: "MONITORING: {"
        new: "CHANNELS: {"

  - path: docs/11-guides/configuration.md

    targets:
      - type: dict_key
        name: MONITORING (in YAML examples)

    semantic_anchors:
      config_section: "## `config.yaml` — Monitoring Configuration"
      monitoring_top_level: "MONITORING:"
      example_minimal: "### Minimal `config.yaml`"
      example_full: "### Full `config.yaml` with Multiple Channels"

    changes:
      - action: replace_text
        description: >
          Replace all "MONITORING" in YAML code blocks and
          descriptive text within the config.yaml guide section.
        old: "MONITORING"
        new: "CHANNELS"
        occurrences: ~12

risk_assessment:
  level: medium
  reason: >
    Changing this YAML key is a BREAKING CHANGE for existing users who
    have configured files with the old "MONITORING" key. However, the
    validation_alias was updated in TASK_008, and all templates are
    updated in sync. Users will need to update their existing config
    files or regenerate them with `mko-telebot init`.

acceptance_criteria:
  - settings/config.yaml uses "CHANNELS" not "MONITORING"
  - settings/keyw_config_example_keep.yaml uses "CHANNELS" not "MONITORING"
  - docs/11-guides/configuration.md YAML examples use "CHANNELS"
  - all YAML files remain valid