# Fix unreachable code in tests - QLT-003

id: TASK_018_qlt_003_fix_unreachable_code
title: Remove unreachable yield statements after raise in async generator test helpers
priority: high

depends_on:
  - TASK_016_qlt_001_sequence_type

source_reference: .ai/audit/99-validation/08-quality-validated.md
source_section: QLT-003
source_blocks:
  - "QLT-003: Unreachable code in tests"

description: >
  Several test async generator helper functions contain unreachable code after
  raise statements. The raise ... yield pattern creates async generators that
  raise on first iteration (never yielding). Remove the unreachable yield
  statements to clean up test logic.

goals:
  - Remove dead code from async generator test helpers
  - Clarify test intent by removing unreachable statements
  - Pass all quality checks

files:
  - path: tests/test_monitor_forward.py
    targets:
      - type: function
        name: _make_async_iter_error_reraise
      - type: function
        name: _make_async_iter_error_reraise2
      - type: function
        name: _make_async_iter_error_reraise3

changes:
  - action: replace_in_body
    description: Remove unreachable yield at line 116 after raise
    old_snippet: |
      yield msg
      raise error
    new_snippet: |
      raise error
    target: _make_async_iter_error_reraise
  - action: replace_in_body
    description: Remove unreachable yield at line 133 after raise
    old_snippet: |
      yield msg
      raise error
    new_snippet: |
      raise error
    target: _make_async_iter_error_reraise2
  - action: replace_in_body
    description: Remove unreachable yield at line 153 after raise
    old_snippet: |
      yield msg
      raise error
    new_snippet: |
      raise error
    target: _make_async_iter_error_reraise3

acceptance_criteria:
  - All unreachable yield statements removed
  - Basedpyright unreachable code warnings resolved
  - Tests continue to pass
  - Test intent is clearer

risk: low
risk_justification: >
  Removing dead code that never executes. The yield statements after raise
  are never reached. Removing them cleans up code without changing behavior.