id: task_005_credential_file_hardening_cross_platform

title: Make credential file hardening cross-platform

priority: medium

status: blocked

blocked_by: task_022_research_windows_acl_approach

depends_on: [task_004_secure_session_file_windows]

depends_on_previous_task_in_chain: false

description: >
  The _is_posix() function in utils.py returns True on Windows because hasattr(os, "chmod")
  is True, but Windows os.chmod silently ignores Unix permission bits (S_IRUSR | S_IWUSR = 0o600).
  Add Windows ACL support to ensure credential files are not left group/other-readable
  on shared Windows hosts.

goals:
  - fix _is_posix() to check Windows-specific file permission capability
  - add Windows ACL hardening path in _secure_file_permissions
  - ensure cross-platform credential protection

files:
  - path: src/mko_telebot/core/utils.py
    targets:
      - type: function
        name: _is_posix
      - type: function
        name: _secure_file_permissions
    semantic_anchors:
      insert_after:
        type: function_call
        value: hasattr

changes:
  - action: add_code
    description: >
      Refactor _is_posix to separate POSIX vs Windows ACL capability, add Windows branch
    code_hint: |
      # On Windows, add ctypes/win32 ACL call after chmod no-op
      # Check platform.system() == "Windows" and apply ACL

acceptance_criteria:
  - credential files have 0600 permissions on POSIX
  - credential files have ACL-restricted permissions on Windows
  - no functional regression in file operations
  - tests pass

tests_to_run:
  - uv run pytest tests/test_utils.py -v