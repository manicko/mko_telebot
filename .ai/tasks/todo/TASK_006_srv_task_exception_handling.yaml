id: task_006_srv_task_exception_handling

source_reference: .ai\audit\99-validation\03-services-validated-findings.md
source_section: SRV-001
related_findings:
  - CLI-004: Duplicate in CLI phase
  - INT-004: Duplicate in Integrations phase
  - QLT-007: Merged into SRV-002

title: Ensure channels rescheduled on process_task exceptions

priority: high

depends_on:
  - task_002_int_fix_start_client_exceptions

description: >
  SRV-001/CLI-004/INT-004: Channel is permanently dropped from monitoring on any 
  exception in `process_task`. The `process_and_reschedule` coroutine exits before 
  calling `reschedule_task`, permanently removing that channel from monitoring.

goals:
  - Wrap `process_task` call in try/except/finally
  - Move `reschedule_task` to finally block for guaranteed execution
  - Log errors but don't re-raise (allow monitoring to continue)

files:
  - path: src/mko_telebot/monitor.py
    targets:
      - type: function
        name: process_and_reschedule
    semantic_anchors:
      - action: wrap_in_try_finally
        target: process_and_reschedule
        around: process_task call and reschedule_task call

changes:
  - action: add_exception_handling
    description: >
      Restructure `process_and_reschedule` to wrap `await process_task(task, client, settings)`
      in try/except that logs the error, then move `asyncio.create_task(reschedule_task(...))`
      to a finally block. This ensures channels are always rescheduled.

acceptance_criteria:
  - Channels remain in monitoring after exceptions
  - Errors are logged but don't crash the monitor
  - All existing tests pass

tests_to_run:
  - uv run pytest tests/test_monitor.py -v
  - uv run pytest tests/test_monitor_forward.py -v