id: TASK_019_test_cli
title: "Wave 5 — Add CLI tests"
priority: medium
depends_on:
  - TASK_015_cli_entry
source_reference: .ai/plans/01/PLAN_01_WAVE_05.md
source_section: "Task 5.3 — Add CLI tests"

description: >
  Create `tests/test_cli.py` with tests for CLI commands using typer.testing.CliRunner.
  Test --help, version, config, validate (with missing config), init (with force + tmp dir).

goals:
  - test --help shows all five commands
  - test version shows version string
  - test config shows table with paths
  - test validate exits code 1 when config missing
  - test init creates config directory with template files

files:
  - path: tests/test_cli.py
    semantic_anchors:
      - type: function
        name: test_cli_help
      - type: function
        name: test_cli_version
      - type: function
        name: test_cli_config
      - type: function
        name: test_cli_validate_missing
      - type: function
        name: test_cli_init
    changes:
      - action: create
        description: Create test_cli.py with CLI command tests

acceptance_criteria:
  - all 5+ test cases implemented
  - CliRunner used for command invocation
  - ruff check passes with no errors
  - all tests pass

tests_to_run:
  - uv run pytest tests/test_cli.py -v
  - uv run ruff check tests/test_cli.py