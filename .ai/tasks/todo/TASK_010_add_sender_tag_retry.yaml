id: task_010_add_sender_tag_retry

title: Add bounded retry for sender resolution on transient errors

priority: medium

depends_on: []

description: >
  build_sender_tag (monitor_client.py:119-160) catches RPCError and transport errors
  (OSError, ConnectionError, TimeoutError), logs, and returns "" without retry. For
  transient network errors, a short retry would likely succeed. Add bounded retry
  (max 2 attempts, 1s sleep) for Telethon's transient error types to reduce silent
  sender loss on network blips.

goals:
  - add retry loop for transient errors in build_sender_tag
  - use max 2 attempts with 1s sleep between
  - log WARNING with msg.id on final failure

files:
  - path: src/mko_telebot/monitor_client.py
    targets:
      - type: function
        name: build_sender_tag
    semantic_anchors:
      replace_in_body:
        - type: exception_handler
          value: except RPCError as e: ... return ""
        - type: exception_handler
          value: except (OSError, ConnectionError, TimeoutError) as e: ... return ""

changes:
  - action: add_code
    description: >
      Wrap get_sender in retry loop; log warning on final failure
    code_hint: |
      for attempt in range(2):
          try:
              sender = await msg.get_sender()
              # ... success path
              break
          except (OSError, ConnectionError, TimeoutError, TimedOutError, ServerError) as e:
              if attempt == 1:
                  logger.warning("Sender resolution failed for msg.id=%s after retries", msg.id)
                  return ""
              await asyncio.sleep(1)

acceptance_criteria:
  - build_sender_tag retries transient errors up to 2 times
  - Warning logged on final failure
  - tests pass

tests_to_run:
  - uv run pytest tests/test_monitor.py -v -k build_sender_tag