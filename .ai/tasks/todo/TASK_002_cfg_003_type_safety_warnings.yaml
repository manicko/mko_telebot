id: TASK_002_cfg_003_type_safety_warnings
title: Fix type safety warnings in config.py and channels.py
priority: medium

depends_on:
  - TASK_001

source_reference: .ai/audit/99-validation/02-config-validated.md
source_section: CFG-003
source_blocks:
  - "CFG-003: Type safety warnings in config.py and channels.py"
  - "Research Findings: CFG-003 Clarification"

description: >
  Fix basedpyright type safety warnings in config.py and channels.py:
  add explicit type annotations to class attributes, annotate YAML loaded data
  as dict[str, Any], and fix unused call result warnings.

goals:
  - Add class attribute type annotations in TelepostConfigReader.__init__
  - Annotate YAML loaded data with dict[str, Any]
  - Fix unused call result in channels.py by assigning to underscore

files:
  - path: src/mko_telebot/core/config.py
    targets:
      - type: method
        name: __init__
        class: TelepostConfigReader
      - type: method
        name: load
        class: TelepostConfigReader
  - path: src/mko_telebot/core/channels.py
    targets:
      - type: method
        name: apply_defaults_to_channels
        class: ChannelsConfig
      - type: method
        name: strip_defaults_from_channels
        class: ChannelsConfig

changes:
  - action: add_code
    description: Add type annotations to class attributes in TelepostConfigReader.__init__
    code_hint: |
      self.config_path: Path = config_path
      self.secrets_path: Path = secrets_path
      self.log_config_path: Path | None = log_config_path
      self._settings: TelepostSettings | None = None
    target: TelepostConfigReader.__init__
  - action: add_code
    description: Annotate YAML loaded data with explicit type
    code_hint: |
      data: dict[str, Any] = yaml.safe_load(f)
    target: TelepostConfigReader.load
  - action: replace_in_body
    description: Fix unused call result in channels.py
    code_hint: |
      _ = self.channels.pop("DEFAULTS", None)
    target: strip_defaults_from_channels
  - action: add_code
    description: Annotate loop variables in apply_defaults_to_channels
    code_hint: |
      update_data: dict[str, Any] = {}
      for field_name, default_value in defaults_data.items():
          current_val: Any = getattr(channel, field_name)
    target: apply_defaults_to_channels

acceptance_criteria:
  - All class attributes in __init__ have explicit type annotations
  - YAML loaded data uses dict[str, Any] annotation
  - Unused call result fixed with underscore assignment
  - basedpyright type checking passes

risk: low
risk_justification: >
  Type annotation additions and unused variable fixes have no runtime impact.
  All changes are additive or cosmetic. No behavior changes.