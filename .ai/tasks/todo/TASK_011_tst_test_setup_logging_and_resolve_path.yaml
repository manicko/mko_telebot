id: TASK_011_tst_test_setup_logging_and_resolve_path

title: Add tests for setup_logging and resolve_path functions

priority: medium

status: pending

depends_on: []

description: >
  Add test coverage for setup_logging() in logging.py and resolve_path() in
  config.py. These supporting functions lack dedicated unit tests but are used
  across the codebase.

goals:
  - Test setup_logging YAML config loading success
  - Test setup_logging fallback to basicConfig
  - Test resolve_path absolute path passthrough
  - Test resolve_path relative path resolution
  - Test resolve_path home-directory expansion

files:
  - path: tests/test_logging.py
    targets:
      - type: test_class
        name: TestSetupLogging

  - path: tests/test_config.py
    targets:
      - type: test_class
        name: TestResolvePath

changes:
  - action: add_top_level
    description: >
      Create test classes for setup_logging and resolve_path

    code_hint: |
      # TestSetupLogging covers:
      # - successful YAML config loading
      # - fallback to basicConfig when file missing
      # - error handling for invalid config
      
      # TestResolvePath covers:
      # - absolute path passthrough
      # - relative path resolution
      # - home-directory (~) expansion
      # - edge cases

acceptance_criteria:
  - All new tests pass
  - setup_logging test coverage >= 80%
  - resolve_path test coverage >= 80%