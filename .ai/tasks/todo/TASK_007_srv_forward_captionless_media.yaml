id: task_007_srv_forward_captionless_media

source_reference: .ai\audit\99-validation\03-services-validated-findings.md
source_section: SRV-003

title: Forward captionless media when keywords is empty

priority: medium

depends_on: []

description: >
  SRV-003: Captionless media-only messages are silently dropped, contradicting the
  documented forwarding behavior. The condition `if msg_text and (...)` skips when
  `msg_text == ""` (no text, no caption), but media with empty keywords should still forward.

goals:
  - Update `process_messages` condition to forward captionless media
  - Align code behavior with documentation
  - Add test coverage for media-only with empty keywords

files:
  - path: src/mko_telebot/monitor_forward.py
    targets:
      - type: function
        name: process_messages
    semantic_anchors:
      - action: modify_condition
        target: process_messages
        line: 181-184
        change: "(msg_text and keyword_match) or (content["media"] and not task.keywords)"

changes:
  - action: fix_condition
    description: >
      Change the condition to: `if (msg_text and not task.keywords) or (msg_text and any(...)) or (content["media"] and not task.keywords)`.
      This forwards media when keywords is empty.

acceptance_criteria:
  - Captionless media forwards when keywords is empty
  - Media with captions still works correctly
  - Text-only matching behavior unchanged
  - Doc behavior aligned with code

tests_to_run:
  - uv run pytest tests/test_monitor_forward.py -v
  - uv run pytest tests/test_monitor.py -v