# Refactor long functions - STR-001

id: TASK_015_str_001_refactor_long_functions
title: Refactor _send_with_retry, process_task, forward_to_users to reduce line counts
priority: medium

depends_on:
  - TASK_014_str_002_extract_message_grouping

source_reference: .ai/audit/99-validation/09-structural-quality-validated.md
source_section: STR-001
source_blocks:
  - "STR-001: Functions Exceeding 50 Line Limit in monitor_forward.py"

description: >
  Three functions in monitor_forward.py exceed the recommended 50-line limit:
  _send_with_retry (63 lines), process_task (62 lines), and forward_to_users
  (57 lines). Refactor these functions to reduce line counts by extracting
  helper functions while preserving behavior.

goals:
  - Reduce _send_with_retry below 50 lines
  - Reduce process_task below 50 lines
  - Reduce forward_to_users below 50 lines
  - Preserve all error handling and retry logic

files:
  - path: src/mko_telebot/monitor_forward.py
    targets:
      - type: function
        name: _send_with_retry
      - type: function
        name: process_task
      - type: function
        name: forward_to_users

changes:
  - action: add_top_level
    description: Extract retry delay calculation to _calculate_backoff helper
    code_hint: |
      def _calculate_backoff(error: Exception) -> float:
          """Calculate backoff delay based on error type."""
          if isinstance(error, FloodWaitError):
              return error.seconds + random.uniform(5, 10)
          elif isinstance(error, RPCError):
              return 5.0
          else:
              return 3.0
    target: _send_with_retry
  - action: add_top_level
    description: Extract state saving logic to _save_task_state helper
    code_hint: |
      async def _save_task_state(task: Task, messages: list[Message]) -> None:
          """Save task state after processing messages."""
          task.set_offset_date(messages[-1].date)
          task.backup_state()
          await task.save_state()
    target: process_task
  - action: add_top_level
    description: Extract caption building to _build_caption helper
    code_hint: |
      def _build_caption(msg: Message, sender_tag: str | None) -> str:
          """Build caption for forwarded message."""
          parts = [sender_tag] if sender_tag else []
          parts.append(msg.message or "")
          link = build_message_link(msg) if msg else None
          return "\n".join(part for part in parts if part)
    target: forward_to_users

acceptance_criteria:
  - All three functions reduced below 50 lines
  - Behavior preserved through helper functions
  - All retry logic maintained
  - Tests pass

risk: medium
risk_justification: >
  Refactoring that changes internal structure. Must preserve exact behavior
  including error handling, retry logic, and state management. Changes touch
  complex async functions with multiple exit points.