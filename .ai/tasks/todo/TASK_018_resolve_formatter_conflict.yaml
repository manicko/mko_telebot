id: task_018_resolve_formatter_conflict

title: Standardize on ruff format in pre-commit hooks

priority: high

depends_on: []

description: >
  Repository has mutually inconsistent formatting configuration: black/isort in
  .pre-commit-config.yaml and ruff format in pyproject.toml. AGENTS.md mandates
  ruff format --check as the verification command. Remove isort/black hooks and
  add ruff-format hook to resolve conflict.

goals:
  - remove mirrors-isort and black hooks from .pre-commit-config.yaml
  - add ruff-format hook
  - standardize formatter for project

files:
  - path: .pre-commit-config.yaml
    targets:
      - type: hook
        name: mirrors-isort
      - type: hook
        name: black

changes:
  - action: delete_key
    description: >
      Remove black/isort hooks; add ruff format hook
    code_hint: |
      # Replace mirrors-isort and black with:
      - repo: https://github.com/astral-sh/ruff-pre-commit
        rev: v0.5.0
        hooks:
          - id: ruff-format

acceptance_criteria:
  - .pre-commit-config.yaml uses only ruff-format
  - pre-commit install succeeds
  - ruff format --check passes

tests_to_run:
  - uv run ruff format --check src/ tests/