---
id: task_004_add_channel_name_validation
title: Add path sanitization validator for ChannelConfig.name
priority: medium
type: implementation
status: pending
depends_on: []

source_reference: .ai\audit\99-validation\04-security-validated-findings.md
source_section: SEC-002

description: |
  The channel_name value from ChannelConfig flows into file path construction 
  without sanitization. A malicious channel_name containing path traversal sequences 
  (e.g., "../../") could write state files outside the intended state directory.

goals:
  - Prevent path traversal attacks via channel name
  - Reject names containing /, \, or .. patterns
  - Maintain backward compatibility for valid Telegram identifiers

files:
  - path: src/mko_telebot/core/channels.py

    targets:
      - type: class
        name: ChannelConfig

      - type: method
        name: field_validator

    semantic_anchors:
      insert_after:
        type: field
        value: name

changes:
  - action: add_field
    description: |
      Add field_validator on ChannelConfig.name to reject path separators and .. sequences.
      Valid Telegram channel identifiers: @username, t.me/..., or alphanumeric names.

    code_hint: |
      @field_validator("name")
      @classmethod
      def validate_channel_name(cls, v: str) -> str:
          if "/" in v or "\\" in v or ".." in v:
              raise ValueError(f"Invalid channel name: contains forbidden path character")
          return v

acceptance_criteria:
  - ChannelConfig rejects channel_name with / or \ or ..
  - Valid Telegram identifiers pass validation unchanged
  - No mypy or ruff errors