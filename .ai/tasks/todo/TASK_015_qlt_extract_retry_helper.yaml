id: TASK_015_qlt_extract_retry_helper

title: Extract retry logic into helper function in forward_to_users

priority: medium

status: pending

depends_on:
  - TASK_005_int_add_worker_busy_retry

description: >
  The forward_to_users function (88 lines) has nesting depth of 4 due to
  embedded retry logic. Extract the retry loop into a separate async helper
  `_send_with_retry()` to improve maintainability and testability.

goals:
  - Extract retry loop into _send_with_retry helper function
  - Reduce nesting depth in forward_to_users
  - Make retry behavior testable in isolation
  - Replace for...else anti-pattern with explicit success tracking

files:
  - path: src/mko_telebot/monitor_forward.py

    targets:
      - type: function
        name: forward_to_users

changes:
  - action: add_top_level
    description: >
      Create _send_with_retry helper function and refactor forward_to_users

    code_hint: |
      async def _send_with_retry(
          client: TelegramClient,
          target: Any,
          caption: str,
          msg_media: list[Any] | None,
          max_tries: int = 5
      ) -> bool:
          """Send message with retry logic. Returns True on success, False on failure."""
          for attempt in range(max_tries):
              try:
                  # send logic here
                  return True
              except FloodWaitError as e:
                  wait_time = get_exponential_backoff_with_jitter(attempt)
                  await asyncio.sleep(wait_time)
              except RPCError as e:
                  wait_time = get_exponential_backoff_with_jitter(attempt)
                  await asyncio.sleep(wait_time)
          return False

acceptance_criteria:
  - Nesting depth reduced in forward_to_users
  - _send_with_retry tests pass with mocked client
  - forward_to_users behavior unchanged
  - mypy passes