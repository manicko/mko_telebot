id: task_009_add_2fa_password_support

title: Add 2FA password support for user accounts

priority: high

depends_on: [task_004_secure_session_file_windows]

description: >
  start_client (monitor_client.py:92-94) catches SessionPasswordNeededError and
  returns False, treating it same as generic auth failure. run_monitor then raises
  TelegramAuthError and terminates. For is_user=true (default config), Telegram
  frequently requires 2FA password. Add password field to TelethonConfig and thread
  it through start_client for proper 2FA handling.

goals:
  - add password: SecretStr | None field to TelethonConfig
  - thread password through start_client
  - raise explicit TelegramAuthError when 2FA required but no password configured

files:
  - path: src/mko_telebot/core/telethon.py
    targets:
      - type: class
        name: TelethonConfig
    semantic_anchors:
      insert_after:
        type: field
        value: api_hash

  - path: src/mko_telebot/monitor_client.py
    targets:
      - type: function
        name: start_client
    semantic_anchors:
      insert_after:
        type: function_call
        value: client.start

  - path: src/mko_telebot/settings/telethon_config.yaml
    targets: []

changes:
  - action: add_code
    description: >
      Add password field; pass to client.start(); improve error message
    code_hint: |
      password: SecretStr | None = None
      # In start_client: client.start(phone=..., password=password.get_secret_value() if password else None)

acceptance_criteria:
  - TelethonConfig has optional password field
  - start_client passes password to client.start()
  - SessionPasswordNeededError raises explicit "2FA password required" error when no password
  - tests pass

tests_to_run:
  - uv run pytest tests/test_monitor_client.py -v -k start_client
  - uv run pytest tests/test_config_reader.py -v