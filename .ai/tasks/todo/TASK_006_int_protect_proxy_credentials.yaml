id: TASK_006_int_protect_proxy_credentials

title: Use SecretStr for proxy username/password in ClientConfig

priority: medium

status: pending

depends_on:
  - TASK_003_cfg_validate_proxy_rdns

description: >
  Create a dedicated ProxyConfig Pydantic model with SecretStr fields for username
  and password to prevent credential exposure. The current implementation uses a
  plain dict which exposes credentials when model_dump(mode='json') is called.

goals:
  - Create ProxyConfig model with SecretStr for credentials
  - Update ClientConfig to use ProxyConfig instead of dict[str, object]
  - Maintain Telethon compatibility with dict conversion
  - Prevent accidental credential leakage in logs

files:
  - path: src/mko_telebot/core/telethon.py

    targets:
      - type: class
        name: ClientConfig
      - type: field
        name: proxy

changes:
  - action: add_top_level
    description: >
      Create ProxyConfig model with SecretStr fields for username and password

    code_hint: |
      class ProxyConfig(BaseModel):
          proxy_type: str
          addr: str
          port: int
          rdns: bool | None = None
          username: SecretStr | None = None
          password: SecretStr | None = None

          def to_dict(self) -> dict[str, object]:
              # Convert to Telethon-compatible dict format
              result = {"proxy_type": self.proxy_type, "addr": self.addr, "port": self.port}
              if self.rdns is not None:
                  result["rdns"] = self.rdns
              if self.username is not None:
                  result["username"] = self.username.get_secret_value()
              if self.password is not None:
                  result["password"] = self.password.get_secret_value()
              return result

acceptance_criteria:
  - ProxyConfig validates proxy fields correctly
  - SecretStr prevents credential exposure in dict output
  - Existing client creation code works with new model
  - to_dict() produces valid Telethon proxy configuration