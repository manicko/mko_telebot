# TASK_012_simplify_offset_date.yaml
# Advisory fix — Remove redundant self-assignment in set_offset_date

id: TASK_012_simplify_offset_date

title: Simplify set_offset_date method to use single assignment pattern

priority: medium

depends_on: []

source_reference: .ai/audit/99-validation/03-services-validated-findings.md
source_section: SRV-002
source_blocks:
  - "SRV-002: set_offset_date method has redundant self-assignment and returns value unnecessarily"

description: >
  The set_offset_date method in Task class has redundant assignment: it sets
  self.offset_date internally and also returns it for assignment. The __init__
  calls self.offset_date = self.set_offset_date() but the method already sets
  the attribute internally.

goals:
  - Remove internal self.offset_date assignment or remove return
  - Use Option B: remove return, keep internal assignment (cleaner)

files:
  - path: src/mko_telebot/core/task.py

    targets:
      - type: method
        name: set_offset_date

semantic_anchors:
  insert_before:
    type: assignment
    value: self.offset_date = None

changes:
  - action: modify_function_body
    description: Remove redundant self.offset_date = None and return statement
    target: set_offset_date
    code_hint: |
      # Remove line: self.offset_date = None (redundant)
      # Remove line: return self.offset_date (redundant)
      # Keep internal assignment at line 118: self.offset_date = datetime.now(UTC) - timedelta(days=days)

acceptance_criteria:
  - No redundant assignment in Task.__init__
  - offset_date is computed correctly
  - Tests pass