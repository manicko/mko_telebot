id: task_008_enable_telethon_flood_sleep_threshold

title: Disable Telethon auto-sleep to use manual handlers

priority: medium

depends_on: []

description: >
  Telethon clients have a built-in flood_sleep_threshold (default 60s) that auto-sleeps
  on FloodWaitError. The project also has manual FloodWaitError handlers in
  _send_with_retry, _fetch_messages, and task.py. The two policies can conflict,
  causing double-sleeping for waits under 60s. Set flood_sleep_threshold=0 in
  create_client to disable Telethon's auto-sleep and use manual handlers as single
  source of truth.

goals:
  - set flood_sleep_threshold=0 in TelegramClient constructor
  - prevent double-sleeping on flood waits
  - ensure consistent retry behavior

files:
  - path: src/mko_telebot/monitor_client.py
    targets:
      - type: function
        name: create_client
    semantic_anchors:
      insert_after:
        type: function_call
        value: TelegramClient

  - path: src/mko_telebot/core/task.py
    targets:
      - type: function
        name: resolve_targets_entities
      - type: function
        name: resolve_channel_entity
    semantic_anchors:
      insert_after:
        type: exception_handler
        value: except FloodWaitError

changes:
  - action: add_code
    description: >
      Add flood_sleep_threshold=0 to TelegramClient constructor
    code_hint: |
      TelegramClient(..., flood_sleep_threshold=0)

acceptance_criteria:
  - Telethon does not auto-sleep on FloodWaitError
  - manual handlers remain the only retry mechanism
  - tests pass

tests_to_run:
  - uv run pytest tests/test_monitor_client.py -v
  - uv run pytest tests/test_task.py -v