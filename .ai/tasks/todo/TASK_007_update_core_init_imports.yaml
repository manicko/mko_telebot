id: TASK_007_update_core_init_imports

title: Update core/__init__.py imports for all renamed modules

priority: high

depends_on:
  - TASK_002_rename_telethon_models
  - TASK_003_rename_channels_file_and_class
  - TASK_004_rename_config_reader

source_reference: .ai/plans/FILE_NAMING_RESEARCH.md
source_section: "5.2 — Import Updates Required After Rename"

description: >
  Update all import paths in src/mko_telebot/core/__init__.py to
  reference the renamed modules:
  1. from .chats_config → from .channels (with ChatsConfig → ChannelsConfig)
  2. from .config_reader → from .config
  3. Update __all__: "ChatsConfig" → "ChannelsConfig"

goals:
  - update import: .chats_config → .channels
  - update import: .config_reader → .config
  - update __all__ entry: "ChatsConfig" → "ChannelsConfig"
  - keep all other imports and exports unchanged

files:
  - path: src/mko_telebot/core/__init__.py

    targets:
      - type: import
        name: chats_config

      - type: import
        name: config_reader

      - type: list
        name: __all__

    semantic_anchors:
      line_7: from .chats_config import ChannelConfig, ChannelDefaults, ChatsConfig, LogLevel
      line_8: from .config_reader import TelepostConfigReader, resolve_path
      line_19: "ChatsConfig"

changes:
  - action: update_import

    description: >
      Replace chats_config module import with channels module import,
      updating class name from ChatsConfig to ChannelsConfig.

    old: from .chats_config import ChannelConfig, ChannelDefaults, ChatsConfig, LogLevel
    new: from .channels import ChannelConfig, ChannelDefaults, ChannelsConfig, LogLevel

  - action: update_import

    description: >
      Replace config_reader module import with config module import.

    old: from .config_reader import TelepostConfigReader, resolve_path
    new: from .config import TelepostConfigReader, resolve_path

  - action: update___all__

    description: >
      Update the "ChatsConfig" entry in __all__ to "ChannelsConfig".

    old: "ChatsConfig"
    new: "ChannelsConfig"

risk_assessment:
  level: low
  reason: >
    Straightforward import path and symbol updates. All target modules
    have already been renamed (TASK_002, TASK_003, TASK_004). No
    behavioral changes.

acceptance_criteria:
  - core/__init__.py imports from .channels (not .chats_config)
  - core/__init__.py imports from .config (not .config_reader)
  - __all__ contains "ChannelsConfig" not "ChatsConfig"
  - all re-exports resolve correctly
  - uv run ruff check on core/__init__.py passes