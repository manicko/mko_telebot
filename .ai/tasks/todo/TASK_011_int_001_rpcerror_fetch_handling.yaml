# RPCError handling in process_task - INT-001

id: TASK_011_int_001_rpcerror_fetch_handling
title: Add RPCError handling during message fetching to match send retry logic
priority: medium

depends_on:
  - TASK_010_int_004_floodwait_entity_resolution

source_reference: .ai/audit/99-validation/05-integrations-validated.md
source_section: INT-001
source_blocks:
  - "INT-001: Missing RPCError handling during message fetching in process_task"

description: >
  The process_task() function catches FloodWaitError, WorkerBusyTooLongRetryError,
  and TelegramServiceError during message fetching, but does NOT catch generic
  RPCError. Since RPCError is the base class for all Telegram RPC errors
  (including TimedOutError and ServerError), transient network errors during
  iter_messages() are not handled with retry logic. Add RPCError handling
  to ensure transient errors are handled gracefully and consistently with
  send operations.

goals:
  - Add RPCError exception handling in process_task()
  - Ensure transient errors (TimedOutError, ServerError) are handled
  - Consistent error handling with send retry logic

files:
  - path: src/mko_telebot/monitor_forward.py
    targets:
      - type: method
        name: process_task

changes:
  - action: add_code
    description: Add RPCError to exception handlers in process_task message fetching
    code_hint: |
      # Add to existing exception handlers (around line 232-244):
      except RPCError as e:
          logger.warning(
              f"RPC error during message fetching: {type(e).__name__}"
          )
          await asyncio.sleep(5)
          raise TelegramServiceError(
              f"Failed to fetch messages for {task.channel_name}: {e}"
          ) from e
    target: process_task around line 232-244

acceptance_criteria:
  - RPCError caught during message fetching
  - Transient errors handled with appropriate logging
  - Consistent with send operation error handling
  - Tests pass

risk: medium
risk_justification: >
  Extends error handling to catch additional exception types. Must verify
  the handler provides appropriate delay and logging consistent with other
  RPCError handling patterns in the codebase.