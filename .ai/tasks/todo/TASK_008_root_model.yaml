id: TASK_008_root_model
title: "Wave 2 — Create root settings model"
priority: high
depends_on:
  - TASK_006_telethon_models
  - TASK_007_chats_config
source_reference: .ai/plans/01/PLAN_01_WAVE_02.md
source_section: "Task 2.4 — Create root settings model"

description: >
  Create `src/mko_telebot/core/models.py` with TelepostSettings root model.
  Use validation_alias for backward compatibility with uppercase YAML keys
  (TELETHON_API, MONITORING). Import TelethonConfig and ChatsConfig.

goals:
  - create TelepostSettings with telethon and monitoring fields
  - validation_alias="TELETHON_API" and validation_alias="MONITORING" for backward compat
  - populate_by_name=True for access via both aliased and Python names
  - import types from telethon_models and chats_config

files:
  - path: src/mko_telebot/core/models.py
    targets:
      - type: class
        name: TelepostSettings
    changes:
      - action: create
        description: Create models.py with TelepostSettings root model

acceptance_criteria:
  - TelepostSettings has telethon: TelethonConfig field with validation_alias="TELETHON_API"
  - TelepostSettings has monitoring: ChatsConfig field with validation_alias="MONITORING"
  - populate_by_name=True in ConfigDict
  - ruff check passes with no errors
  - mypy passes with no errors

tests_to_run:
  - uv run ruff check src/mko_telebot/core/models.py
  - uv run mypy src/mko_telebot/core/models.py