id: task_004_secure_session_file_windows

title: Add session file permission hardening for Windows

priority: high

status: blocked

blocked_by: task_022_research_windows_acl_approach

depends_on: []

depends_on_previous_task_in_chain: false

description: >
  Telethon creates .session auth-key files containing authenticated session keys.
  The code in monitor_client.py:create_client secures the session directory but does
  not harden the session file itself after client creation. On Windows, os.chmod
  ignores Unix permission bits. Add Windows ACL support via pywin32 or ctypes to
  properly restrict session file access on Windows.

goals:
  - apply 0600-equivalent permissions to .session files on POSIX
  - add Windows ACL hardening for session files
  - protect credential exposure on shared Windows hosts

files:
  - path: src/mko_telebot/monitor_client.py
    targets:
      - type: function
        name: create_client
    semantic_anchors:
      insert_after:
        type: function_call
        value: _secure_directory_permissions

  - path: src/mko_telebot/core/utils.py
    targets:
      - type: function
        name: _is_posix
      - type: function
        name: _secure_file_permissions
    semantic_anchors:
      insert_after:
        type: function_call
        value: os.chmod

changes:
  - action: add_code
    description: >
      Add Windows session file hardening after client.start()
    code_hint: |
      # After client.start(), harden session file permissions
      # on Windows using ctypes/win32 or on POSIX using os.chmod 600

acceptance_criteria:
  - session file has restricted permissions on POSIX
  - session file has ACL-restricted permissions on Windows
  - no functional regression in client creation
  - tests pass

tests_to_run:
  - uv run pytest tests/test_monitor_client.py -v