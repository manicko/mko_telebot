id: TASK_007_sec_validate_session_name

title: Add path traversal validation for session field in ClientConfig

priority: medium

status: pending

depends_on:
  - TASK_003_cfg_validate_proxy_rdns

description: >
  Add explicit path traversal validation for the session field in ClientConfig.
  Currently only placeholder values are validated. Should reject /, \, and ..
  characters to prevent path traversal attacks.

goals:
  - Add path character validation to validate_not_placeholder
  - Reject /, \, and .. characters in session names
  - Align with defensive pattern used for channel names

files:
  - path: src/mko_telebot/core/telethon.py

    targets:
      - type: method
        name: validate_not_placeholder
        class: ClientConfig

changes:
  - action: add_code
    description: >
      Add path traversal checks in validate_not_placeholder method

    code_hint: |
      # After existing placeholder checks, add:
      if '/' in v or '\\' in v or '..' in v:
          raise ValueError('session must not contain path traversal characters')

acceptance_criteria:
  - Path traversal characters raise ValueError
  - Standard session names like 'user_session' still accepted
  - Existing tests pass