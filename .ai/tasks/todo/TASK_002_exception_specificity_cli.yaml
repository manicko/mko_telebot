# TASK_002_exception_specificity_cli.yaml
# Mandatory fix — Project rules require proper error handling, KeyboardInterrupt should not mask intentional shutdown

id: TASK_002_exception_specificity_cli

title: Separate exception handlers in cli.run command

priority: high

depends_on: []

source_reference: .ai/audit/99-validation/01-cli-validated-findings.md
source_section: CLI-003
source_blocks:
  - "CLI-003: Improper exception specificity in `run` command masks root cause"

description: >
  The `run` command catches `MkoTelebotError` and `KeyboardInterrupt` together,
  producing generic "Failed to run monitor" output. Separate exception handling
  to distinguish configuration errors from intentional shutdown.

goals:
  - Separate MkoTelebotError and KeyboardInterrupt handling
  - Show diagnostic message for configuration errors
  - Show shutdown message for KeyboardInterrupt

files:
  - path: src/mko_telebot/cli.py

    targets:
      - type: function
        name: run

semantic_anchors:
  insert_after:
    type: function_call
    value: run_monitor

changes:
  - action: modify_function_body
    description: Replace combined exception handler with separate handlers
    code_hint: |
      # Replace:
      except (MkoTelebotError, KeyboardInterrupt):
          console.print("[red]Error:[/red] Failed to run monitor")
      
      # With:
      except MkoTelebotError as e:
          console.print(f"[red]Error:[/red] Failed to run monitor - {e}")
      except KeyboardInterrupt:
          console.print("[yellow]Shutdown requested[/yellow]")

acceptance_criteria:
  - Configuration errors show diagnostic message including error details
  - KeyboardInterrupt shows "Shutdown requested" message
  - No silent swallowing of errors
