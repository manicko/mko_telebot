# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
        name: isort

  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        name: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff-check
        name: ruff-check
        # ruff-check will lint only (no --fix), uses ruff config from pyproject.toml

  # Mypy - run using system python so it sees your installed editable package
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        args: ["--config-file=pyproject.toml"]
        pass_filenames: true
        types: [python]

  # Pytest - run tests locally; configured as system so pytest uses your venv
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
        types: [python]
        files: ^tests/.*\.py$
#        stages: [pre-push]
