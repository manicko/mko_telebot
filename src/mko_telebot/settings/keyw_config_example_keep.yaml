# Keyword configuration example for mko_telebot.
# Copy this file to your user settings directory and customize for your channels.
# See docs/11-guides/configuration.md for full documentation.

CHANNELS:
  channels_delay: 30
  stagger_start_seconds: 5
  defaults:
    scan_interval: 420
    history_limit: 50
    history_days: 2
    overlap: 5
  channels:
    # Example channel configuration.
    # Replace '@your_channel' with the actual channel username or t.me link.
    # Each channel requires a 'name' field.
    channel_1:
      name: "@your_channel"
      keywords:
        - "keyword1"
        - "keyword2"
      forward_to:
        - "@target_channel"
    # Add more channels as needed:
    # channel_2:
    #   name: "@another_channel"
    #   keywords:
    #     - "important"
    #   forward_to:
    #     - "@admin_chat"