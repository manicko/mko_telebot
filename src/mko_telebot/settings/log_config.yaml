# Logging configuration for mko_telebot.
# Uses Python logging.config.dictConfig schema.
# See: https://docs.python.org/3/library/logging.config.html#dictionary-schema-details

LOGGING:
  version: 1
  disable_existing_loggers: false

  # Formatters define the log message format.
  formatters:
    basic:
      class: logging.Formatter
      format: "%(asctime)s - %(levelname)s - %(message)s - %(name)s "
      datefmt: "%d-%m-%y %I:%M:%S %p"

  # Handlers send log records to appropriate destinations.
  handlers:
    console:
      class: logging.StreamHandler
      formatter: basic
      level: INFO
      stream: ext://sys.stdout

    rotating_file:
      class: logging.handlers.RotatingFileHandler
      formatter: basic
      level: INFO
      filename: log.log
      maxBytes: 2000000
      backupCount: 2
      encoding: utf-8

  # Loggers send log records to handlers.
  loggers:
    __main__:
      handlers:
        - rotating_file
      level: INFO
      propagate: false

    tests:
      handlers:
        - rotating_file
      level: INFO
      propagate: false

    telebot:
      handlers:
        - console
        - rotating_file
      level: INFO
      propagate: false

  # Root logger configuration.
  root:
    level: INFO
    handlers:
      - console
      - rotating_file